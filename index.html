<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我來異世界可不想再成為塔羅師</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --bg:#1c1410; --bg2:#26190f; --ink:#f1e6d6; --ink2:#c9b59c; --muted:#8c7a66;
  --ember:#e0693a; --ember2:#f2a35c; --gold:#e8c27a; --line:#4a3424; --card:#f4e9d6; --card-ink:#3a2618;
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(ellipse at 50% -10%,#3b2112 0%,var(--bg) 55%) fixed;color:var(--ink);
  font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;line-height:1.85;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:rgba(28,20,16,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:14px;color:var(--ink2)}
.meter{display:flex;align-items:center;gap:8px}
.meter-bar{width:120px;height:8px;border-radius:4px;background:#3a281b;overflow:hidden}
#heat-fill{height:100%;width:0;background:linear-gradient(90deg,var(--ember),var(--ember2));transition:width .6s}
#wand{padding:2px 8px;border:1px solid var(--line);border-radius:10px}
#wand.awake{color:var(--gold);border-color:var(--gold);box-shadow:0 0 10px rgba(232,194,122,.35)}
.spacer{flex:1}
.tool{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:12px;padding:2px 8px;border-radius:8px;cursor:pointer}
.tool:hover{color:var(--ink2)}
#flags{display:none;gap:6px;flex-basis:100%;flex-wrap:wrap}
.flag{font-size:12px;padding:0 6px;border-radius:6px;background:#2d1f15}
.flag.good{color:#9fd18b}.flag.bad{color:#e88a7a}
main{max-width:680px;margin:0 auto;padding:28px 18px 80px}
#stage{animation:fade .4s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.chapter-kicker{color:var(--ember2);letter-spacing:.4em;font-size:14px;margin-top:20px}
.chapter-title{font-size:56px;margin:0;letter-spacing:.2em;color:var(--ink)}
.lead{color:var(--ink2);font-size:18px}
.home-intro{max-width:560px;margin:6px 0 18px;color:var(--ink2);font-size:15px;line-height:1.9}
.home-intro p{margin:6px 0}
.home-intro p:first-child{color:var(--ink);font-size:16px}
.cover-hero{position:relative;max-width:760px;margin:10px auto 18px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.cover-hero img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.cover-ov{position:absolute;left:0;right:0;bottom:0;padding:70px 24px 18px;background:linear-gradient(180deg,rgba(12,9,14,0) 0%,rgba(12,9,14,.55) 40%,rgba(12,9,14,.85) 100%)}
.cover-title{margin:0;font-size:clamp(36px,8vw,56px);letter-spacing:.2em;color:#fff8ec;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.cover-lead{margin:4px 0 0;font-size:clamp(14px,3.6vw,18px);color:#f3e6cf;text-shadow:0 1px 8px rgba(0,0,0,.8)}.lead.small{font-size:15px;text-align:center}
.panel{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:6px 18px;color:var(--ink2);font-size:15px}
.panel b{color:var(--ink)}
.step-label{font-size:13px;letter-spacing:.25em;color:var(--ember2);margin-bottom:14px}
.major-label{color:var(--gold)}
.narr{font-size:17px;margin:0 0 12px}
.hint{color:var(--muted);font-size:13px;text-align:center}
.dejavu{color:var(--gold);font-style:italic;font-size:15px;opacity:.9}
.btn-row{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.btn{font:inherit;font-size:16px;padding:10px 26px;border-radius:24px;cursor:pointer;border:1px solid var(--ember)}
.btn.primary{background:linear-gradient(180deg,#e0693a,#b84a24);color:#fff8ef;border-color:#b84a24}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:none;color:var(--ink2);border-color:var(--line)}
.card-row{display:flex;gap:18px;justify-content:center;margin:20px 0 34px;flex-wrap:wrap}
.card-slot{display:flex;flex-direction:column;align-items:center;gap:6px}
.slot-cap{font-size:13px;color:var(--muted);letter-spacing:.2em}
.card{width:112px;height:187px;border-radius:8px;position:relative;flex:none}
.card.back{background:#5a2b16;border:2px solid #8a4a2a;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.back-pattern{position:absolute;inset:8px;border:1px solid rgba(242,163,92,.5);border-radius:6px;
  background:repeating-linear-gradient(45deg,rgba(242,163,92,.12) 0 6px,transparent 6px 12px)}
.card.back.clickable{cursor:pointer;transition:transform .2s}
.card.back.clickable:hover{transform:translateY(-6px);box-shadow:0 10px 22px rgba(224,105,58,.35)}
.card.back.dim{opacity:.3;cursor:default;transform:none;box-shadow:none}
.card.face{background:var(--card);color:var(--card-ink);border:2px solid #c9a774;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.card.face.major{border-color:var(--gold);background:linear-gradient(180deg,#fbf2df,#efdcb8)}
.card-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .3s}
.card.reversed .card-inner{transform:rotate(180deg)}
/* 1909 Pam-A 牌面 */
.card.face.art{padding:0;overflow:visible;background:#f4ecd8;border:2px solid #c9a774}
.card.face.art.major{border-color:var(--gold)}
.card-art{position:absolute;inset:0;border-radius:6px;overflow:hidden;transition:transform .3s}
.card-art img{width:100%;height:100%;object-fit:cover;display:block}
.card.reversed .card-art{transform:rotate(180deg)}
.card-cap{position:absolute;bottom:-24px;left:-20px;right:-20px;text-align:center;font-size:12px;color:var(--ink2);letter-spacing:.08em;white-space:nowrap}
.card.reversed .card-cap .o{color:#e88a7a}
/* 小牌（回憶、圖鑑、回憶牆） */
.mini-art{display:inline-block;flex:none;width:var(--mw,44px);aspect-ratio:3/5;border-radius:4px;overflow:hidden;border:1px solid #c9a774;background:#f4ecd8;vertical-align:middle}
.mini-art img{width:100%;height:100%;object-fit:cover;display:block}
.mini-art.rev img{transform:rotate(180deg)}
.mini-art.back{background:repeating-linear-gradient(45deg,rgba(242,163,92,.12) 0 5px,transparent 5px 10px),#3a2214;border-color:var(--line);display:inline-grid;place-items:center;color:var(--muted);font-size:18px}
.sum-card{width:auto;min-width:150px;display:flex;align-items:center;gap:10px}
.sum-card .mini-art{--mw:46px}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:420px){.cgrid{grid-template-columns:repeat(2,1fr)}}
.ccell{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:8px;border:1px solid var(--line);font-size:13px;text-align:center}
.ccell .mini-art{--mw:64px}
.ccell small{font-size:11px;color:var(--muted)}
.ccell.solved{background:rgba(232,194,122,.15);border-color:var(--gold);color:var(--gold)}
.ccell.solved .mini-art{border-color:var(--gold);box-shadow:0 0 10px rgba(232,194,122,.35)}
.ccell.seen{color:var(--ink2)}.ccell.seen .mini-art{opacity:.45;filter:grayscale(.6)}
.ccell.unseen{color:var(--muted)}
.portrait.has-img{width:88px;height:88px;padding:0;overflow:hidden}
.portrait.has-img img{width:100%;height:100%;object-fit:cover;display:block}
.cover-img{display:block;width:100%;max-width:760px;margin:18px auto 6px;border-radius:10px;border:1px solid var(--line);aspect-ratio:3/2;object-fit:cover}
.cc-cover{display:block;width:calc(100% + 40px);margin:-18px -20px 12px;height:120px;object-fit:cover;border-radius:14px 14px 0 0;opacity:.9}
.chapter-card{overflow:hidden}
.wt-cards{display:flex;gap:6px;margin:4px 0 6px}
.wt-cards .mini-art{--mw:34px}
.card-num{font-size:34px;font-weight:700;color:#a7432a}
.card.major .card-num{color:#8a6a1e}
.card-name{font-size:18px;font-weight:600;letter-spacing:.1em}
.card-code{font-size:11px;color:#8c7356;letter-spacing:.15em}
.card-orient{position:absolute;bottom:-24px;left:0;right:0;text-align:center;font-size:12px;color:var(--ink2)}
.card.reversed .card-orient{color:#e88a7a}
.flip-in{animation:flip .45s}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
.event{display:flex;gap:22px;align-items:flex-start;margin-bottom:40px}
.event .card{margin-top:4px}
.event-text{flex:1}
@media (max-width:520px){.event{flex-direction:column;align-items:center}.event .card{margin-bottom:22px}}
.options{display:flex;flex-direction:column;gap:10px}
.option{font:inherit;font-size:16px;text-align:left;padding:12px 16px;border-radius:10px;cursor:pointer;
  background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line);transition:all .2s}
.option:hover:not(:disabled){border-color:var(--ember2);background:rgba(224,105,58,.08)}
.option.picked{border-color:var(--ember2);background:rgba(224,105,58,.14)}
.option.faded{opacity:.35}
.option:disabled{cursor:default}
.outcome{margin-top:18px}
.attitude{font-size:14px;color:var(--ink2);border-left:3px solid var(--line);padding-left:10px}
.gain{display:inline-block;margin-top:4px;padding:2px 14px;border-radius:14px;background:rgba(224,105,58,.2);color:var(--ember2);font-weight:600;animation:pop .5s}
.gain.muted{background:rgba(255,255,255,.05);color:var(--muted);font-weight:400}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.ending{text-align:center;padding:30px 20px;border-radius:14px;border:1px solid var(--line);margin-top:10px}
.ending.awake{border-color:var(--gold);box-shadow:0 0 40px rgba(232,194,122,.2) inset}
.ending-tag{margin-top:10px;font-size:14px;letter-spacing:.2em;color:var(--gold)}
.ending.half .ending-tag{color:var(--muted)}
.summary{display:flex;flex-direction:column;gap:6px}
.sum-row{display:flex;gap:12px;align-items:center;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.03);font-size:15px}
.sum-card{width:96px;flex:none;color:var(--ink)}
.sum-att{flex:1;color:var(--ink2)}
.pt{color:var(--ember2);font-weight:600}.pt.zero{color:var(--muted)}.pt.muted{color:var(--muted);font-weight:400;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{border-radius:8px;padding:10px 6px;text-align:center;font-size:14px;border:1px solid var(--line);min-height:58px;display:flex;flex-direction:column;justify-content:center}
.cell small{font-size:11px;color:var(--muted)}
.cell.solved{background:rgba(232,194,122,.15);border-color:var(--gold);color:var(--gold)}
.cell.seen{color:var(--ink2);opacity:.6}
.cell.unseen{color:var(--muted)}
h3.sec{font-size:15px;color:var(--ink2);letter-spacing:.15em;margin:22px 0 10px;font-weight:600}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.people{grid-template-columns:1fr}}
.person{display:flex;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px;background:rgba(255,255,255,.03)}
.person.met{border-color:#7a4a2a}
.portrait{width:72px;height:96px;flex:none;border-radius:8px;background:linear-gradient(180deg,#4a2615,#2b170d);border:1px solid #8a4a2a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ember2);font-size:22px;font-weight:700}
.portrait small{font-size:10px;color:var(--muted);font-weight:400;margin-top:4px}
.person.unmet .portrait{background:#241912;border-color:var(--line);color:var(--muted)}
.pname{font-weight:600;color:var(--ink)}.pcard{font-size:12px;color:var(--gold);margin-left:8px;font-weight:400}
.pinfo p{margin:4px 0 0;font-size:13px;line-height:1.7;color:var(--ink2)}
.person.unmet .pname{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#3a2214;border:1px solid var(--gold);color:var(--gold);
  padding:8px 18px;border-radius:20px;opacity:0;pointer-events:none;z-index:30}
#toast.show{animation:toast 2.4s}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
.center{text-align:center}
.deck-table{position:relative;height:250px;margin:10px 0 0}
.deck-card{position:absolute;left:50%;top:20px;margin-left:-56px;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s,top .3s}
.deck-card.shuffling{animation:riffle .7s ease-in-out 2}
@keyframes riffle{0%,100%{transform:translateX(0)}35%{transform:translateX(var(--dx)) rotate(4deg)}65%{transform:translateX(calc(var(--dx) * -.3))}}
.deck-card.fanned:hover:not(.taken):not(.dim){top:4px}
.deck-card.taken{opacity:0;pointer-events:none}
.deck-card.dim{opacity:.25;cursor:default}
.picked-row{min-height:200px;margin-top:0}
.picked-row .slot-cap{margin-top:22px}
body[data-theme="water"]{--bg:#0e1820;--bg2:#13222d;--ink:#e3eef3;--ink2:#a9c3cf;--muted:#6f8a97;
  --ember:#3a8fb7;--ember2:#7cc4e0;--gold:#bfe3f0;--line:#244150;--card:#eef5f7;--card-ink:#173040}
body[data-theme="water"]{background:radial-gradient(ellipse at 50% -10%,#173a4d 0%,var(--bg) 55%) fixed}
body[data-theme="water"] header{background:rgba(14,24,32,.92)}
body[data-theme="water"] .meter-bar{background:#1d3340}
body[data-theme="water"] .card.back{background:#16405a;border-color:#2f6f8f}
body[data-theme="water"] .back-pattern{border-color:rgba(124,196,224,.5);background:repeating-linear-gradient(45deg,rgba(124,196,224,.12) 0 6px,transparent 6px 12px)}
body[data-theme="water"] .card.face{border-color:#8fb9c9}
body[data-theme="water"] .card.face.major{border-color:#c9a774;background:linear-gradient(180deg,#fbf2df,#efdcb8)}
body[data-theme="water"] .card-num{color:#2a6f93}
body[data-theme="water"] .card.major .card-num{color:#8a6a1e}
body[data-theme="water"] .btn.primary{background:linear-gradient(180deg,#3a8fb7,#256a8c);border-color:#256a8c}
body[data-theme="water"] .option:hover:not(:disabled){background:rgba(58,143,183,.1)}
body[data-theme="water"] .option.picked{background:rgba(58,143,183,.18)}
body[data-theme="water"] .gain{background:rgba(58,143,183,.22)}
body[data-theme="water"] .portrait{background:linear-gradient(180deg,#1b4560,#10283a);border-color:#2f6f8f}
body[data-theme="water"] #toast{background:#14303f}
body[data-theme="air"]{--bg:#15161d;--bg2:#1c1d27;--ink:#eceef6;--ink2:#b4b8cc;--muted:#7a7f96;
  --ember:#6c74b8;--ember2:#aab1ea;--gold:#d9dcf5;--line:#33364a;--card:#f1f2f7;--card-ink:#24263a}
body[data-theme="air"]{background:radial-gradient(ellipse at 50% -10%,#2a2d45 0%,var(--bg) 55%) fixed}
body[data-theme="air"] header{background:rgba(21,22,29,.92)}
body[data-theme="air"] .meter-bar{background:#262838}
body[data-theme="air"] .card.back{background:#2f3352;border-color:#555b8f}
body[data-theme="air"] .back-pattern{border-color:rgba(170,177,234,.5);background:repeating-linear-gradient(45deg,rgba(170,177,234,.12) 0 6px,transparent 6px 12px)}
body[data-theme="air"] .card.face{border-color:#a6aac8}
body[data-theme="air"] .card-num{color:#4b52a0}
body[data-theme="air"] .btn.primary{background:linear-gradient(180deg,#6c74b8,#4d5494);border-color:#4d5494}
body[data-theme="air"] .option:hover:not(:disabled){background:rgba(108,116,184,.1)}
body[data-theme="air"] .option.picked{background:rgba(108,116,184,.2)}
body[data-theme="air"] .gain{background:rgba(108,116,184,.25)}
body[data-theme="air"] .portrait{background:linear-gradient(180deg,#30355a,#1d2036);border-color:#555b8f}
body[data-theme="air"] #toast{background:#262840}
body[data-theme="earth"]{--bg:#14170f;--bg2:#1b1f14;--ink:#eee9d6;--ink2:#c3bc9c;--muted:#8a8669;
  --ember:#7f9440;--ember2:#c9b45a;--gold:#e6d58c;--line:#3a3f27;--card:#f3efdf;--card-ink:#2e2b17}
body[data-theme="earth"]{background:radial-gradient(ellipse at 50% -10%,#2f3518 0%,var(--bg) 55%) fixed}
body[data-theme="earth"] header{background:rgba(20,23,15,.92)}
body[data-theme="earth"] .meter-bar{background:#272b1a}
body[data-theme="earth"] .card.back{background:#3d4520;border-color:#6d7a36}
body[data-theme="earth"] .back-pattern{border-color:rgba(201,180,90,.5);background:repeating-linear-gradient(45deg,rgba(201,180,90,.12) 0 6px,transparent 6px 12px)}
body[data-theme="earth"] .card.face{border-color:#bfb17a}
body[data-theme="earth"] .card-num{color:#6b7a2a}
body[data-theme="earth"] .card.major .card-num{color:#8a6a1e}
body[data-theme="earth"] .btn.primary{background:linear-gradient(180deg,#7f9440,#5f7130);border-color:#5f7130}
body[data-theme="earth"] .option:hover:not(:disabled){background:rgba(127,148,64,.1)}
body[data-theme="earth"] .option.picked{background:rgba(127,148,64,.2)}
body[data-theme="earth"] .gain{background:rgba(127,148,64,.25)}
body[data-theme="earth"] .portrait{background:linear-gradient(180deg,#3f4722,#232812);border-color:#6d7a36}
body[data-theme="earth"] #toast{background:#2a3018}
.chapter-card.theme-air{background:linear-gradient(135deg,#262a44,#15161d);border-color:#555b8f;color:#eceef6}
.chapter-card.theme-earth{background:linear-gradient(135deg,#2f3518,#14170f);border-color:#6d7a36;color:#eee9d6}
body[data-theme="cliff"]{--bg:#110f17;--bg2:#1a1722;--ink:#f0eadb;--ink2:#c2b9a3;--muted:#857d6c;
  --ember:#b8913f;--ember2:#e3c172;--gold:#f0d68c;--line:#3a3329;--card:#f6efdf;--card-ink:#2b2416}
body[data-theme="cliff"]{background:radial-gradient(ellipse at 50% -10%,#2c2338 0%,var(--bg) 60%) fixed}
body[data-theme="cliff"] header{background:rgba(17,15,23,.92)}
body[data-theme="cliff"] .btn.primary{background:linear-gradient(180deg,#b8913f,#8c6c2a);border-color:#8c6c2a}
body[data-theme="cliff"] .option.picked{background:rgba(184,145,63,.18)}
#hud.finale .meter,#hud.finale #wand,#hud.finale #run-num,#hud.finale #toggle-flags,#hud.finale #reset{display:none}
.chapter-card.theme-cliff{background:linear-gradient(135deg,#2c2338,#110f17);border-color:#8c6c2a;color:#f0eadb}
.toolchip{display:inline-block;padding:2px 10px;border-radius:12px;border:1px solid var(--line);margin:2px;font-size:14px;color:var(--muted)}
.toolchip.on{border-color:var(--gold);color:var(--gold)}
.judge-block{margin:18px 0 6px}
.judge-land{font-size:14px;letter-spacing:.2em;color:var(--ember2);margin-bottom:8px}
.own{display:flex;gap:8px;margin-top:8px}
.own-input{flex:1;font:inherit;font-size:15px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink)}
.btn.small{font-size:14px;padding:6px 16px}
.judged{color:var(--gold)}
.home-title{font-size:30px;margin:6px 0 0;letter-spacing:.08em}
.chapters{display:grid;gap:14px;margin-top:20px}
.chapter-card{font:inherit;text-align:left;cursor:pointer;border-radius:14px;padding:18px 20px;border:1px solid;transition:transform .2s}
.chapter-card:hover{transform:translateY(-3px)}
.chapter-card.theme-fire{background:linear-gradient(135deg,#3a1d10,#1f140e);border-color:#7a4a2a;color:#f1e6d6}
.chapter-card.theme-water{background:linear-gradient(135deg,#123247,#0e1820);border-color:#2f6f8f;color:#e3eef3}
.cc-kicker{font-size:13px;letter-spacing:.3em;opacity:.7}
.cc-title{font-size:32px;font-weight:700;letter-spacing:.2em}
.cc-lead{opacity:.85}
.cc-meta{font-size:13px;opacity:.6;margin-top:6px}
.meet{margin:4px 0 12px;padding:6px 12px;border-left:3px solid var(--ember2);background:rgba(255,255,255,.04);border-radius:0 8px 8px 0;font-size:14px;color:var(--ink2)}
.meet b{color:var(--ink);margin-right:2px}.meet-label{font-size:11px;letter-spacing:.2em;color:var(--ember2);margin-right:10px}
#confirm{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20}
#confirm .box{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:20px 24px;max-width:320px;text-align:center}
.journey-box{text-align:center;margin:8px 0 28px}
.spread{display:flex;flex-direction:column;gap:16px;margin:10px 0 24px;padding:18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03)}
.spread-label{font-size:13px;color:var(--muted);letter-spacing:.15em;margin-bottom:6px}
.spread-cards{display:flex;flex-wrap:wrap;gap:6px}
.mini{width:48px;height:76px;border-radius:5px;background:var(--card);color:var(--card-ink);border:1px solid #c9a774;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:1.25;text-align:center;padding:2px}
.mini b{font-size:15px}
.mini.major{border-color:var(--gold);background:linear-gradient(180deg,#fbf2df,#efdcb8)}
.mini.rev{transform:rotate(180deg)}
.spread-quotes p{margin:4px 0;color:var(--ink);font-size:16px}
.narr.wedge{font-size:18px;line-height:2.1}
.wedge-card{justify-content:center}
.keep-title{text-align:center;font-size:26px;margin:6px 0;letter-spacing:.08em}
.keep-holder{display:flex;justify-content:center;margin:16px 0}
.keep-img{width:100%;max-width:520px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin:18px 0}
.wall-tile{font:inherit;text-align:left;background:linear-gradient(180deg,#2c2338,#110f17);color:#f0eadb;border:1px solid #8c6c2a;border-radius:12px;padding:14px;cursor:pointer;min-height:150px;display:flex;flex-direction:column;gap:4px}
.wall-tile.loop{border-color:#4a3d55;opacity:.85}
.wall-tile:hover{filter:brightness(1.15)}
.wt-n{font-size:20px;font-weight:700}.wt-e{font-size:13px;color:#c9a774}.wt-q{font-size:14px;flex:1;line-height:1.6}.wt-d{font-size:12px;color:#857d6c}
.fb-label{margin:18px 0 6px;color:var(--ink2);font-size:14px}
.fb-row{display:flex;gap:8px;flex-wrap:wrap}
.option.fb-chip{width:auto;display:inline-block;margin:0}
.star{font-size:30px;background:none;border:none;color:#5a5048;cursor:pointer;padding:0 2px}.star.on{color:var(--gold)}
.fb-input,.fb-text{width:100%;box-sizing:border-box}
.fb-text{min-height:120px;font:inherit;resize:vertical}
.privacy p{margin:12px 0;line-height:1.9}
.home-foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.btn.small{font-size:13px;padding:6px 14px}
a.btn{text-decoration:none;display:inline-block}
[hidden]{display:none!important}
.keep-lead{text-align:center;color:var(--ink2);margin:4px 0 0}
.keep-lines{max-width:560px;margin:10px auto 0;color:var(--ink2);font-size:15px;line-height:1.9}
.keep-lines p{margin:4px 0}
.hint.center{text-align:center}
#credit-tag{position:fixed;right:10px;bottom:10px;z-index:15;display:none;font:inherit;font-size:11px;letter-spacing:.05em;padding:3px 9px;border-radius:10px;
  background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--muted);cursor:pointer}
#credit-tag:hover{color:var(--ink2)}
#credits{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#credits .box{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:22px 24px;max-width:460px;font-size:14px;line-height:1.9;color:var(--ink2)}
#credits h3{margin:0 0 8px;color:var(--ink);font-size:18px;letter-spacing:.1em}
#credits p{margin:8px 0}
.unlock-hint{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 0}
</style>
</head>
<body>
<header id="hud">
  <button class="tool" id="home">選單</button>
  <div class="meter"><span id="meter-name">火候</span> <div class="meter-bar"><div id="heat-fill"></div></div> <span id="heat-num"></span></div>
  <span id="wand"></span>
  <span id="run-num"></span>
  <span class="spacer"></span>
  <button class="tool" id="toggle-flags">旗標（測試）</button>
  <button class="tool" id="reset">重置進度</button>
  <div id="flags"></div>
</header>
<main><div id="stage"></div></main>
<div id="toast"></div>
<div id="confirm"><div class="box"><p id="confirm-text"></p>
  <div class="btn-row"><button class="btn primary" id="confirm-yes">清除</button><button class="btn ghost" id="confirm-no">取消</button></div></div></div>

  W06: "權杖六", W07: "權杖七", W08: "權杖八", W09: "權杖九", W10: "權杖十",

  closing: "他們往紅色的那一邊走去。",

    "收攤的時候起了一陣怪風，一張牌從桌上被吹落，翻滾著飛進黑暗裡。他追過騎樓、追過紅綠燈，追上一段他不記得夜市附近有過的斜坡。那張牌停在坡頂，正面朝上：0 愚人。"
  ],
  wedgeEnd: "他蹲下去撿。後來的事，他就不記得了。"

const CHAPTERS = [CHIYUAN, CHENGHU, FENGCHENG, JINSUI];
const MENU = [PROLOGUE, ...CHAPTERS, FINALE];
let C = null;            // 目前章節
let progress = null;     // 目前章節的進度
let run = null;
let queue = [];
let showFlags = false;
const memStores = {};

function blankProgress() { return { runs: 0, heat: 0, solved: {}, seen: {}, awake: false, met: {} }; }
function loadProgress(ch) {
  let p = null;
  try { const raw = localStorage.getItem(ch.storeKey); if (raw) p = JSON.parse(raw); } catch (e) { p = memStores[ch.id]; }
  p = p || blankProgress();
  p.met = p.met || {};
  return p;
}
function saveProgress() {
  memStores[C.id] = progress;
  try { localStorage.setItem(C.storeKey, JSON.stringify(progress)); } catch (e) {}
}

const $ = (s) => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const drawUp = () => Math.random() < 2 / 3;

function setChapter(ch) {
  C = ch;
  progress = ch ? loadProgress(ch) : null;
  document.body.dataset.theme = ch ? ch.theme : "fire";
}

function updateHud() {
  const hud = $("#hud");
  hud.style.visibility = C ? "visible" : "hidden";
  hud.classList.toggle("finale", !!(C && C.type));
  if (!C || C.type) return;
  const pct = Math.min(progress.heat / THRESHOLD, 1) * 100;
  $("#meter-name").textContent = C.meter;
  $("#heat-fill").style.width = pct + "%";
  $("#heat-num").textContent = `${progress.heat} / ${THRESHOLD}`;
  $("#run-num").textContent = run ? `第 ${progress.runs + 1} 輪` : `已走 ${progress.runs} 輪`;
  $("#wand").textContent = `${C.tool}：${progress.awake ? "醒" : "沉睡"}`;
  $("#wand").classList.toggle("awake", progress.awake);
  const fb = $("#flags");
  fb.style.display = showFlags && run ? "flex" : "none";
  if (run) fb.innerHTML = C.chars.map(c => `<span class="flag ${run.flags[c]}">${c}：${({ good: "好", bad: "壞", normal: "普通" })[run.flags[c]]}</span>`).join("");
}

function markMet(text, box) {
  C.people.forEach(pp => {
    if (text.includes(pp.name) && !progress.met[pp.name]) {
      progress.met[pp.name] = true; saveProgress();
      if (box) box.appendChild(el("div", "meet", `<span class="meet-label">人物登場</span><b>${pp.name}</b>　${pp.tag}`));
      const t = $("#toast"); t.textContent = `新人物：${pp.name}`; t.classList.remove("show"); void t.offsetWidth; t.classList.add("show");
    }
  });
}

function stage() { const s = $("#stage"); s.innerHTML = ""; window.scrollTo(0, 0); return s; }

function cardFace(code, up) {
  const major = code.startsWith("M");
  const c = el("div", "card face" + (up ? "" : " reversed") + (major ? " major" : ""));
  const name = C.cardNames[code] || "";
  c.classList.add("art"); c.title = name;
  c.innerHTML = `<div class="card-art"><img src="img/cards/${code}.jpg" alt="${name}" draggable="false"></div>`;
  c.appendChild(el("div", "card-cap", major ? name : `${name}・<span class="o">${up ? "正位" : "逆位"}</span>`));
  return c;
}
function cardBack() { return el("div", "card back", `<div class="back-pattern"></div>`); }
function continueBtn(text = "繼續", fn = next) { const b = el("button", "btn primary", text); b.onclick = fn; return b; }
function next() { const step = queue.shift(); updateHud(); if (step) step(); }

// ---------- 章節選單 ----------
// 封面副標（可自行改寫）
const TAGLINE = "翻開牌之後，你會……？";
// 封面玩法簡介（可自行改寫；每一項是一段）
const INTRO = [
  "這不是性格測驗，是一趟讀懂塔羅牌的旅程。",
  "路上的每件事，都會翻開一張牌。選出最符合這張牌意思的做法，就讀懂了它；讀懂得夠多，四樣工具才會醒來。",
  "第一趟走不完是正常的。一趟大約 20 分鐘，再出發時，你會比上一次更懂這些牌。"
];

function showHome() {
  run = null; queue = [];
  setChapter(null);
  updateHud();
  const s = stage();
  if (DEMO) s.appendChild(el("div", "chapter-kicker", "試玩版"));
  s.appendChild(el("h1", "home-title", "我來異世界可不想再成為塔羅師"));
  const unlocked = DEMO || hasCleared();
  s.appendChild(el("p", "lead", TAGLINE));
  const intro = el("div", "home-intro");
  INTRO.forEach(x => intro.appendChild(el("p", null, x)));
  s.appendChild(intro);
  const jr = el("div", "btn-row journey-box");
  jr.appendChild(continueBtn("踏上旅程", startJourney));
  const saved = loadJourney();
  if (saved && saved.idx > 0 && saved.idx < journeyOrder().length) {
    const rb = el("button", "btn ghost", `繼續上次的旅程（${journeyOrder()[saved.idx].title}）`); rb.onclick = resumeJourney; jr.appendChild(rb);
  }
  s.appendChild(jr);
  if (!unlocked) {
    const foot0 = el("div", "home-foot");
    if (hasEnded()) foot0.appendChild(btnGhost("回憶牆", showWall, "small"));
    if (hasEnded() && FEEDBACK_PAGE) foot0.appendChild(btnGhost("給作者回饋", () => showFeedback(showHome), "small"));
    foot0.appendChild(btnGhost("隱私說明", () => showPrivacy(showHome), "small"));
    s.appendChild(foot0);
    return;
  }
  s.appendChild(el("div", "step-label", "章節選單"));
  const list = el("div", "chapters");
  MENU.forEach(ch => {
    const p = loadProgress(ch);
    const b = el("button", "chapter-card theme-" + ch.theme);
    const meta = ch.type === "prologue"
      ? (p.runs ? `已走 ${p.runs} 次` : "從這裡開始")
      : ch.type === "finale"
      ? "四樣工具：" + toolStatus().map(t => `${t.tool}${t.awake ? "醒" : "睡"}`).join("・")
      : `${ch.meter} ${p.heat} / ${THRESHOLD}・${ch.tool}${p.awake ? "已醒" : "沉睡"}・圖鑑 ${collectN(ch, p)}`;
    b.innerHTML = (coverSrc(ch) ? `<img class="cc-cover" src="${coverSrc(ch)}" alt="" loading="lazy">` : "") + `<div class="cc-kicker">${ch.kicker}</div><div class="cc-title">${ch.title}</div><div class="cc-lead">${ch.lead}</div>
      <div class="cc-meta">${meta}</div>`;
    b.onclick = () => { setChapter(ch); showTitle(); };
    list.appendChild(b);
  });
  s.appendChild(list);
  const foot = el("div", "home-foot");
  if (hasEnded()) foot.appendChild(btnGhost("回憶牆", showWall, "small"));
  if (hasEnded() && FEEDBACK_PAGE) foot.appendChild(btnGhost("給作者回饋", () => showFeedback(showHome), "small"));
  foot.appendChild(btnGhost("隱私說明", () => showPrivacy(showHome), "small"));
  s.appendChild(foot);
}

// 圖鑑收集數：遇見的人物 + 已懂的事件
function collectN(ch, p) {
  const got = ch.people.filter(pp => p.met[pp.name]).length + Object.keys(p.solved || {}).length;
  const all = ch.people.length + Object.keys(ch.events).length;
  return `${got} / ${all}`;
}

function showTitle() {
  if (C.type === "finale") return showFinaleTitle();
  if (C.type === "prologue") return showPrologueTitle();
  run = null;
  updateHud();
  const s = stage();
  landHero(s, C);
  const row = el("div", "btn-row");
  row.appendChild(continueBtn(progress.runs ? `再走一次${C.title}` : `走進${C.title}`, startRun));
  if (progress.runs) { const r = el("button", "btn ghost", "查看圖鑑"); r.onclick = () => showCollection(showTitle); row.appendChild(r); }
  const h = el("button", "btn ghost", "回到章節選單"); h.onclick = showHome; row.appendChild(h);
  s.appendChild(row);
}

function startRun() {
  run = { flags: Object.fromEntries(C.chars.map(c => [c, "normal"])), orient: { [C.startCode]: drawUp(), [C.endCode]: drawUp() }, choice: null, log: [], trail: [] };
  queue = C.sequence.map(st => {
    if (st[0] === "open") return showOpening;
    if (st[0] === "ev") return () => showEvent(st[1], run.orient[st[1]], st[2]);
    if (st[0] === "slot") return () => showSlot(st[1]);
    if (st[0] === "major") return () => showMajor(st[1]);
    return showEnding;
  });
  next();
}

// 洗牌、攤成扇形、抽 need 張；pool 依抽出順序發牌
function deckDraw(s, pool, need, labels, onDone) {
  const hint = el("p", "narr center", "洗牌中……");
  s.appendChild(hint);
  const DECK = 12;
  const table = el("div", "deck-table");
  const fanCards = [];
  for (let i = 0; i < DECK; i++) {
    const b = cardBack();
    b.classList.add("deck-card");
    b.style.zIndex = i;
    table.appendChild(b);
    fanCards.push(b);
  }
  s.appendChild(table);
  const picked = el("div", "card-row picked-row");
  s.appendChild(picked);
  const btnWrap = el("div", "btn-row");
  s.appendChild(btnWrap);
  fanCards.forEach((b, i) => {
    b.style.setProperty("--dx", (i % 2 ? 46 : -46) + "px");
    b.style.animationDelay = (i * 0.04) + "s";
    b.classList.add("shuffling");
  });
  const chosen = [];
  setTimeout(() => {
    hint.textContent = `抽 ${need} 張牌`;
    const w = Math.min(table.clientWidth, 640);
    const span = Math.min(w - 120, 520);
    fanCards.forEach((b, i) => {
      b.classList.remove("shuffling");
      const t = i / (DECK - 1) - 0.5;
      b.style.transform = `translateX(${t * span}px) translateY(${Math.abs(t) * 34}px) rotate(${t * 34}deg)`;
      b.classList.add("clickable", "fanned");
      b.onclick = () => {
        if (chosen.length >= need || b.classList.contains("taken")) return;
        const card = pool[chosen.length];
        const lab = labels && labels[chosen.length];
        chosen.push(card);
        b.classList.add("taken");
        const holder = el("div", "card-slot");
        const f = cardFace(card.code, card.up);
        f.classList.add("flip-in");
        holder.appendChild(f);
        if (lab) holder.appendChild(el("div", "slot-cap", lab));
        picked.appendChild(holder);
        if (chosen.length === need) {
          fanCards.forEach(x => { if (!x.classList.contains("taken")) x.classList.add("dim"); });
          hint.textContent = "命運已經翻開。";
          onDone(chosen, btnWrap);
        }
      };
    });
  }, 1500);
}

function showOpening() {
  const s = stage();
  s.appendChild(el("div", "step-label", "開局"));
  s.appendChild(el("p", "narr", C.openNarr));
  const pool = [{ code: C.startCode, up: run.orient[C.startCode] }, { code: C.endCode, up: run.orient[C.endCode] }];
  deckDraw(s, pool, 2, ["起點", "終點"], (chosen, btnWrap) => btnWrap.appendChild(continueBtn("出發")));
}

function showSlot(key) {
  const slot = C.slots[key];
  const s = stage();
  s.appendChild(el("div", "step-label", `第 ${({ A: 1, B: 2, C: 3 })[key]} 段路・${slot.name}`));
  const pool = shuffle(slot.cards).map(code => ({ code, up: drawUp() }));
  deckDraw(s, pool, slot.pick, null, (chosen, btnWrap) => {
    const ordered = chosen.slice().sort((a, b2) => a.code.localeCompare(b2.code));
    queue.unshift(...ordered.map(c => () => showEvent(c.code, c.up, slot.name)));
    btnWrap.appendChild(continueBtn());
  });
}

function pickOpen(ev) {
  if (!ev.bridges) return ev.open;
  for (const who of Object.keys(ev.bridges)) {
    const fl = run.flags[who];
    if (fl === "good" || fl === "bad") return ev.bridges[who][fl];
  }
  return ev.open;
}

function showEvent(code, up, where) {
  const id = code + (up ? "U" : "R");
  const ev = C.events[id];
  if (run.trail) run.trail.push({ code, up });
  const s = stage();
  s.appendChild(el("div", "step-label", where));
  const wrap = el("div", "event");
  wrap.appendChild(cardFace(code, up));
  const txt = el("div", "event-text");
  let opening = pickOpen(ev);
  if (code === C.endCode && run.choice && C.lastPrefix[run.choice]) opening = C.lastPrefix[run.choice] + opening;
  txt.appendChild(el("p", "narr", opening + ev.body));
  markMet(opening + ev.body, txt);
  const solved = !!progress.solved[id];
  if (solved) txt.appendChild(el("p", "dejavu", "（這件事，綾已經懂了。）"));
  else if (progress.seen[id]) txt.appendChild(el("p", "dejavu", ev.dejavu));
  wrap.appendChild(txt);
  s.appendChild(wrap);

  const opts = el("div", "options");
  const out = el("div", "outcome");
  shuffle(ev.options).forEach(o => {
    const b = el("button", "option", o.act);
    b.onclick = () => {
      opts.querySelectorAll("button").forEach(x => { x.disabled = true; if (x !== b) x.classList.add("faded"); });
      b.classList.add("picked");
      let gain = 0;
      if (o.s === 1 && !progress.solved[id]) { gain = 1; progress.solved[id] = true; progress.heat += 1; }
      progress.seen[id] = true;
      if (o.f) Object.entries(o.f).forEach(([k, v]) => { run.flags[k] = v; });
      run.log.push({ code, up, att: o.att, s: o.s, gain, already: o.s === 1 && !gain });
      saveProgress();
      out.appendChild(el("p", "narr", o.res));
      markMet(o.res, out);
      if (gain) out.appendChild(el("div", "gain", `${C.meter} +1`));
      else if (o.s === 1) out.appendChild(el("div", "gain muted", "已經懂了，不再加分"));
      out.appendChild(el("div", "btn-row")).appendChild(continueBtn());
      updateHud();
      out.scrollIntoView({ behavior: "smooth", block: "nearest" });
    };
    opts.appendChild(b);
  });
  s.appendChild(opts);
  s.appendChild(out);
}

function majorLine(m) {
  const fl = run.flags[m.flagLine.who];
  return fl !== "normal" && m.flagLine[fl] ? m.flagLine[fl] : (m.flagLine.other || "");
}

function showMajor(code) {
  const m = C.majors[code];
  if (run.trail) run.trail.push({ code, up: true });
  const s = stage();
  s.appendChild(el("div", "step-label major-label", "主線"));
  const wrap = el("div", "event");
  wrap.appendChild(cardFace(code, true));
  const txt = el("div", "event-text");
  txt.appendChild(el("p", "narr", m.text));
  markMet(m.text, txt);
  wrap.appendChild(txt);
  s.appendChild(wrap);
  const finish = () => { m.reset.forEach(c => run.flags[c] = "normal"); next(); };
  const line = majorLine(m);

  if (!m.choice || m.lineBefore) {
    if (line) { txt.appendChild(el("p", "narr", line)); markMet(line, txt); }
  }
  if (!m.choice) {
    s.appendChild(el("div", "btn-row")).appendChild(continueBtn("繼續", finish));
    return;
  }
  const opts = el("div", "options");
  const out = el("div", "outcome");
  m.choice.forEach(o => {
    const b = el("button", "option", o.act);
    b.onclick = () => {
      opts.querySelectorAll("button").forEach(x => { x.disabled = true; if (x !== b) x.classList.add("faded"); });
      b.classList.add("picked");
      run.choice = o.key;
      const tail = m.after + (m.lineBefore ? "" : line) + m.end;
      out.appendChild(el("p", "narr", o.res));
      out.appendChild(el("p", "narr", tail));
      markMet(o.res + tail, out);
      out.appendChild(el("div", "btn-row")).appendChild(continueBtn("繼續", finish));
    };
    opts.appendChild(b);
  });
  s.appendChild(el("p", "hint", `大牌的選擇不影響${C.meter}，但會被記住。`));
  s.appendChild(opts);
  s.appendChild(out);
}

function showEnding() {
  const s = stage();
  s.appendChild(el("div", "step-label", "收尾"));
  let text, cls;
  const wasAwake = progress.awake;
  if (wasAwake) { text = C.ending.already; cls = "awake"; }
  else if (progress.heat >= THRESHOLD) { progress.awake = true; text = C.ending.awake; cls = "awake"; }
  else { text = C.ending.half; cls = "half"; }
  progress.runs += 1;
  saveProgress();
  const box = el("div", "ending " + cls);
  box.appendChild(el("p", "narr", text));
  box.appendChild(el("div", "ending-tag", wasAwake ? `${C.tool}：醒` : progress.awake ? `${C.tool}醒了` : `${C.tool}：半醒`));
  s.appendChild(box);
  s.appendChild(el("div", "btn-row")).appendChild(continueBtn("看這一輪的牌", showSummary));
}

function showSummary() {
  const s = stage();
  const lastLog = run.log;
  if (journey) journeyRecord(run);
  run = null;
  updateHud();
  s.appendChild(el("div", "step-label", `第 ${progress.runs} 輪的旅程・回憶`));
  s.appendChild(el("p", "hint", "這一路上，每一次抉擇時，綾的心是這樣走的。"));
  const list = el("div", "summary");
  lastLog.forEach(l => {
    const r = el("div", "sum-row");
    const mark = l.gain ? `<span class="pt">+1</span>` : l.already ? `<span class="pt muted">已懂</span>` : `<span class="pt zero">0</span>`;
    r.innerHTML = `<span class="sum-card">${miniArt(l.code, l.up)}<span>${C.cardNames[l.code]}・${l.up ? "正" : "逆"}</span></span><span class="sum-att">那時的心：${l.att}</span>${mark}`;
    list.appendChild(r);
  });
  s.appendChild(list);
  const solvedN = Object.keys(progress.solved).length;
  const metN = C.people.filter(pp => progress.met[pp.name]).length;
  s.appendChild(el("p", "lead small", `${C.meter} ${progress.heat} / ${THRESHOLD}・已懂的事件 ${solvedN} / ${Object.keys(C.events).length}・遇見的人物 ${metN} / ${C.people.length}`));
  const row = el("div", "btn-row");
  if (journey) { row.appendChild(continueBtn("繼續旅程", nextJourney)); s.appendChild(row); return; }
  row.appendChild(continueBtn("再走一輪", startRun));
  const c = el("button", "btn ghost", "圖鑑"); c.onclick = () => showCollection(showTitle); row.appendChild(c);
  const h = el("button", "btn ghost", "章節選單"); h.onclick = showHome; row.appendChild(h);
  s.appendChild(row);
}

function showCollection(back) {
  const s = stage();
  s.appendChild(el("div", "step-label", `${C.title}圖鑑`));
  const metN = C.people.filter(pp => progress.met[pp.name]).length;
  s.appendChild(el("h3", "sec", `人物 ${metN} / ${C.people.length}`));
  const pg = el("div", "people");
  C.people.forEach(pp => {
    const met = progress.met[pp.name];

    c.innerHTML = met
      ? (PORTRAIT_FILE[pp.card] ? `<div class="portrait has-img"><img src="img/v1/portrait_${PORTRAIT_FILE[pp.card]}.jpg" alt="${pp.name}" loading="lazy"></div>` : `<div class="portrait"><span>${pp.name}</span><small>圖待生成</small></div>`) + `<div class="pinfo"><div class="pname">${pp.name}<span class="pcard">${pp.card}</span></div><p>${pp.intro}</p></div>`
      : `<div class="portrait"><span>？</span></div><div class="pinfo"><div class="pname">？？？</div><p>還沒在旅途中遇見。</p></div>`;

        : `${miniArt(code, o === "U")}<span>${C.cardNames[code]}</span><small>${o === "U" ? "正位" : "逆位"}</small>`));

// ---------- 終章 ----------
function toolStatus() {
  return FINALE.tools.map(t => {
    const ch = CHAPTERS.find(c => c.id === t.ch);
    return { ...t, awake: !!loadProgress(ch).awake, chObj: ch };
  });
}

function showFinaleTitle() {
  run = null;
  updateHud();
  const s = stage();
  s.appendChild(el("div", "chapter-kicker", C.kicker));
  s.appendChild(el("h1", "chapter-title", C.title));
  s.appendChild(el("p", "lead", C.lead));
  const st = toolStatus();
  const box = el("div", "panel");
  box.innerHTML = `<p>四樣工具目前的狀態：</p><p>` +
    st.map(t => `<span class="toolchip ${t.awake ? "on" : ""}">${t.land}・${t.tool}${t.awake ? "：醒" : "：沉睡"}</span>`).join(" ") + `</p>
    <p>四樣都醒，才會走到真結局；沒全醒，就會在命運之輪輪迴。</p>`;
  s.appendChild(box);
  const row = el("div", "btn-row");
  row.appendChild(continueBtn("照目前進度出發", () => startFinale(false)));
  if (DEMO) { const t = el("button", "btn ghost", "測試：假設四樣都醒了"); t.onclick = () => startFinale(true); row.appendChild(t); }
  const h = el("button", "btn ghost", "回到章節選單"); h.onclick = showHome; row.appendChild(h);
  s.appendChild(row);
}

function majorScene(code, label) {
  const s = stage();
  s.appendChild(el("div", "step-label major-label", label || "終章"));
  const wrap = el("div", "event");
  wrap.appendChild(cardFace(code, true));
  const txt = el("div", "event-text");
  wrap.appendChild(txt);
  s.appendChild(wrap);
  return { s, txt };
}

function startFinale(testAll) {
  const st = toolStatus();
  const lit = testAll ? st : st.filter(t => t.awake);
  run = { finale: true, testAll, judged: [] };
  const all = lit.length === 4;
  queue = [() => showWheel(lit, all)];
  if (all) {
    FINALE.scenes.forEach(sc => queue.push(() => showFinaleScene(sc)));
    queue.push(showJudgement, showWorld);
  } else {
    queue.push(() => showLoop(st));
  }
  next();
}

function showWheel(lit, all) {
  const w = FINALE.wheel;
  const { s, txt } = majorScene(w.code, "回到懸崖");
  txt.appendChild(el("p", "narr", w.text));
  let line = all ? w.all : lit.length ? w.some.replace("{lit}", lit.map(t => t.tool).join("、")) : w.none;
  txt.appendChild(el("p", "narr", line));
  s.appendChild(el("div", "btn-row")).appendChild(continueBtn());
}

function showLoop(st) {
  const { s, txt } = majorScene("M10", "輪迴");
  txt.appendChild(el("p", "narr", FINALE.wheel.loop));
  const box = el("div", "ending half");
  box.appendChild(el("p", "narr", "還沒醒的土地：" + st.filter(t => !t.awake).map(t => `${t.land}（${t.tool}）`).join("、")));
  box.appendChild(el("div", "ending-tag", "輪迴結局"));
  s.appendChild(box);
  if (journey) {
    journey.finale = ["M10"]; journey.ending = "輪迴結局"; journey.judged = null; saveJourney();
    s.appendChild(el("div", "btn-row")).appendChild(continueBtn("繼續", showSpread));
    return;
  }
  const row = el("div", "btn-row");
  row.appendChild(continueBtn("回到章節選單", showHome));
  s.appendChild(row);
}

function showFinaleScene(sc) {
  const { s, txt } = majorScene(sc.code);
  txt.appendChild(el("p", "narr", sc.text));
  if (!sc.choice) { s.appendChild(el("div", "btn-row")).appendChild(continueBtn()); return; }
  const opts = el("div", "options");
  const out = el("div", "outcome");
  sc.choice.forEach(o => {
    const b = el("button", "option", o.act);
    b.onclick = () => {
      opts.querySelectorAll("button").forEach(x => { x.disabled = true; if (x !== b) x.classList.add("faded"); });
      b.classList.add("picked");
      out.appendChild(el("p", "narr", o.res + (sc.after || "")));
      out.appendChild(el("div", "btn-row")).appendChild(continueBtn());
    };
    opts.appendChild(b);
  });
  s.appendChild(opts);
  s.appendChild(out);
}

// ---------- 序章 ----------
function showPrologueTitle() {
  run = null;
  updateHud();
  const s = stage();
  s.appendChild(el("div", "chapter-kicker", C.kicker));
  s.appendChild(el("h1", "chapter-title", C.title));
  s.appendChild(el("p", "lead", C.lead));
  s.appendChild(el("div", "panel", `<p>${C.quote}</p>`));
  const row = el("div", "btn-row");
  row.appendChild(continueBtn(progress.runs ? "再醒來一次" : "翻開第一張牌", () => startPrologue()));
  if (progress.runs) { const w = el("button", "btn ghost", "重看楔子"); w.onclick = () => startPrologue(true); row.appendChild(w); }
  const h = el("button", "btn ghost", "回到章節選單"); h.onclick = showHome; row.appendChild(h);
  s.appendChild(row);
}

function startPrologue(withWedge) {
  if (withWedge === undefined) withWedge = !progress.runs;
  run = { prologue: true, picks: {} };
  queue = [];
  if (withWedge) C.wedge.forEach((t, i) => queue.push(() => showWedge(t, i === C.wedge.length - 1)));
  C.scenes.forEach(sc => queue.push(() => showPrologueScene(sc)));
  queue.push(showPrologueEnd);
  next();
}

function showWedge(t, last) {
  const s = stage();
  s.appendChild(el("div", "step-label", "楔子"));
  if (last) { const w = el("div", "event wedge-card"); w.appendChild(cardFace("M00", true)); s.appendChild(w); }
  s.appendChild(el("p", "narr wedge", t));
  if (last) s.appendChild(el("p", "narr wedge", C.wedgeEnd));
  s.appendChild(el("div", "btn-row")).appendChild(continueBtn());
}

function showPrologueScene(sc) {
  const { s, txt } = majorScene(sc.code, "序章");
  sc.text.forEach(t => txt.appendChild(el("p", "narr", t)));
  if (progress.runs && sc.dejavu) txt.appendChild(el("p", "dejavu", sc.dejavu));
  if (!sc.choice) { s.appendChild(el("div", "btn-row")).appendChild(continueBtn()); return; }
  if (sc.hint) s.appendChild(el("p", "narr center", sc.hint));
  const opts = el("div", "options");
  const out = el("div", "outcome");
  sc.choice.forEach(o => {
    const b = el("button", "option", o.act);
    b.onclick = () => {
      opts.querySelectorAll("button").forEach(x => { x.disabled = true; if (x !== b) x.classList.add("faded"); });
      b.classList.add("picked");
      run.picks[sc.code] = o.key;
      out.appendChild(el("p", "narr", o.res));
      if (sc.after) out.appendChild(el("p", "narr", sc.after));
      out.appendChild(el("div", "btn-row")).appendChild(continueBtn());
    };
    opts.appendChild(b);
  });
  s.appendChild(el("p", "hint", "大牌的選擇不計分，但會被記住。"));
  s.appendChild(opts);
  s.appendChild(out);
}

function showPrologueEnd() {
  progress.runs += 1;
  progress.choices = run.picks;
  if (journey) { journey.prologue = C.scenes.map(sc => sc.code); saveJourney(); }
  saveProgress();
  const s = stage();
  s.appendChild(el("div", "step-label major-label", "序章結束"));
  const cards = el("div", "card-row");
  C.scenes.forEach(sc => cards.appendChild(cardFace(sc.code, true)));
  s.appendChild(cards);
  s.appendChild(el("p", "lead small", C.closing));
  const row = el("div", "btn-row");
  row.appendChild(continueBtn("前往第一章　赤原", journey ? nextJourney : () => { setChapter(CHIYUAN); showTitle(); }));
  const h = el("button", "btn ghost", "回到章節選單"); h.onclick = showHome; row.appendChild(h);
  s.appendChild(row);
}

// ---------- 完整旅程：序章 → 四塊土地 → 終章 ----------
const JOURNEY_KEY = "tarot-journey-proto-v1";
let journey = null;
function journeyOrder() { return [PROLOGUE, ...CHAPTERS, FINALE]; }
function saveJourney() { try { localStorage.setItem(JOURNEY_KEY, JSON.stringify(journey)); } catch (e) {} }
function loadJourney() { try { return JSON.parse(localStorage.getItem(JOURNEY_KEY) || "null"); } catch (e) { return null; } }
function clearJourney() { journey = null; try { localStorage.removeItem(JOURNEY_KEY); } catch (e) {} }
function startJourney() { journey = { idx: 0, prologue: null, lands: [], finale: [], judged: null, ending: "" }; saveJourney(); goJourney(); }
function resumeJourney() { journey = loadJourney(); if (!journey) return showHome(); goJourney(); }
function nextJourney() { journey.idx += 1; saveJourney(); goJourney(); }
function goJourney() {
  const ch = journeyOrder()[journey.idx];
  setChapter(ch);
  if (ch.type === "prologue") return startPrologue(journeyCount() === 0);
  if (ch.type === "finale") return startFinale(false);
  showJourneyGate(ch);
}
function showJourneyGate(ch) {
  run = null; queue = [];
  updateHud();
  const s = stage();
  landHero(s, ch);
  s.appendChild(el("div", "btn-row")).appendChild(continueBtn(`走進${ch.title}`, startRun));
}
function journeyRecord(r) {
  journey.lands = journey.lands.filter(l => l.id !== C.id);
  journey.lands.push({ id: C.id, title: C.title, tool: C.tool, awake: !!progress.awake, cards: r.trail || [], learned: (r.log || []).filter(l => l.s === 1).map(l => ({ code: l.code, up: l.up, att: l.att })) });
  saveJourney();
}
function nameOf(code) {
  for (const c of [PROLOGUE, ...CHAPTERS, FINALE]) if (c.cardNames && c.cardNames[code]) return c.cardNames[code];
  return code;
}
function miniArt(code, up, cls) {
  return `<span class="mini-art${up === false ? " rev" : ""}${cls ? " " + cls : ""}"><img src="img/cards/${code}.jpg" alt="${nameOf(code)}" loading="lazy"></span>`;
}
const PORTRAIT_FILE = { "權杖侍者": "W11_zhang", "權杖騎士": "W12_liefeng", "權杖王后": "W13_kui", "權杖國王": "W14_chicheng",
  "聖杯侍者": "C11_lian", "聖杯騎士": "C12_luolan", "聖杯王后": "C13_baihe", "聖杯國王": "C14_bailang",
  "寶劍侍者": "S11_qingyuan", "寶劍騎士": "S12_jishi", "寶劍王后": "S13_die", "寶劍國王": "S14_hengzhu",
  "錢幣侍者": "P11_suier", "錢幣騎士": "P12_banong", "錢幣王后": "P13_sangniang", "錢幣國王": "P14_fenggu" };
const COVER_IDS = ["chiyuan", "chenghu", "fengcheng", "jinsui"];
const coverSrc = (ch) => ch && COVER_IDS.includes(ch.id) ? `img/v1/cover_${ch.id}.jpg` : null;
// 地區封面：章節標在圖上方，地名與副標疊在圖裡
function landHero(s, ch) {
  s.appendChild(el("div", "chapter-kicker", ch.kicker));
  const src = coverSrc(ch);
  if (!src) { s.appendChild(el("h1", "chapter-title", ch.title)); s.appendChild(el("p", "lead", ch.lead)); return; }
  const box = el("div", "cover-hero");
  const i = el("img"); i.src = src; i.alt = ch.title; box.appendChild(i);
  const ov = el("div", "cover-ov");
  ov.appendChild(el("h1", "cover-title", ch.title));
  ov.appendChild(el("p", "cover-lead", ch.lead));
  box.appendChild(ov);
  s.appendChild(box);
  s.appendChild(rulesPanel(ch));
}
// 玩法說明：每塊土地封面下方
function rulesPanel(ch) {
  const info = el("div", "panel");
  info.innerHTML = `<p>進入${ch.title}時，會先抽兩張牌：旅程的起點與終點。之後每段路都要從洗好的牌裡抽牌。</p>
    <p>每件事有三種做法。選中符合這張牌牌意的那一種，<b>${ch.meter}</b>就會 +1。${ch.meter}跨輪累積，到 ${THRESHOLD}，${ch.tool}就會醒來。同一件事只在第一次做對時加分。</p>`;
  return info;
}
function addCover(s, ch) { const src = coverSrc(ch); if (src) { const i = el("img", "cover-img"); i.src = src; i.alt = ch.title; s.appendChild(i); } }
function miniCard_unused(code, up) {
  const major = code.startsWith("M");
  return el("div", "mini" + (major ? " major" : "") + (up ? "" : " rev"), `<b>${parseInt(code.slice(1), 10)}</b>${nameOf(code)}`);
}
// ---------- 共用小工具 ----------
function btnGhost(text, fn, extra) { const b = el("button", "btn ghost" + (extra ? " " + extra : ""), text); b.onclick = fn; return b; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.remove("show"); void t.offsetWidth; t.classList.add("show"); }
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- 旅程結束頁與紀念卡 ----------
const WALL_KEY = "tarot-wall-v2";
const COUNT_KEY = "tarot-journey-count-v1";
const CLEARED_KEY = "tarot-cleared-v1";
let memWall = [], memCount = 0, memCleared = false;
function loadWall() {
  try { const raw = localStorage.getItem(WALL_KEY); return raw ? JSON.parse(raw) : memWall; } catch (e) { return memWall; }
}
function saveToWall(rec) {
  const w = loadWall().slice(); w.push(rec); memWall = w;
  try { localStorage.setItem(WALL_KEY, JSON.stringify(w.slice(-60))); } catch (e) {}
}
function journeyCount() {
  try { return parseInt(localStorage.getItem(COUNT_KEY) || "0", 10) || memCount; } catch (e) { return memCount; }
}
function bumpJourneyCount() {
  const n = journeyCount() + 1; memCount = n;
  try { localStorage.setItem(COUNT_KEY, String(n)); } catch (e) {}
  return n;
}
const ENDED_KEY = "tarot-ended-v1"; let memEnded = false;
// 走完過一次完整旅程（輪迴結局或真結局都算）：解鎖章節選單與回饋
function hasEnded() {
  try { return localStorage.getItem(ENDED_KEY) === "1" || memEnded || hasCleared(); } catch (e) { return memEnded || memCleared; }
}
function markEnded() {
  memEnded = true;
  try { localStorage.setItem(ENDED_KEY, "1"); } catch (e) {}
}
function hasCleared() {
  try { return localStorage.getItem(CLEARED_KEY) === "1" || memCleared; } catch (e) { return memCleared; }
}
function markCleared() {
  memCleared = true;
  try { localStorage.setItem(CLEARED_KEY, "1"); } catch (e) {}
}
function dateStr() {
  const d = new Date(), pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
}
const endDot = (t) => /[。！？」]$/.test(t) ? t : t + "。";

// 每塊土地挑一張「懂了」的牌：優先用審判時選的那句話所屬的事件
function pickUnderstood(ch, land, judgedLine) {
  if (judgedLine) {
    for (const [id, ev] of Object.entries(ch.events)) {
      const o = ev.options.find(x => x.s === 1);
      if (o && o.att === judgedLine) return { code: id.slice(0, 3), up: id.endsWith("U"), line: judgedLine };
    }
  }
  const learned = (land && land.learned) || [];
  const last = learned[learned.length - 1];
  if (last && typeof last === "object") return { code: last.code, up: last.up, line: judgedLine || last.att };
  const p = loadProgress(ch);
  const id = Object.keys(p.solved || {}).pop();
  if (id && ch.events[id]) {
    const o = ch.events[id].options.find(x => x.s === 1);
    return { code: id.slice(0, 3), up: id.endsWith("U"), line: judgedLine || (o ? o.att : "") };
  }
  return { code: ch.startCode, up: true, line: judgedLine || "" };
}
function buildRecord(n) {
  const judged = journey.judged || [];
  const ending = journey.ending || "輪迴結局";
  const stats = journeyStats();
  return {
    v: 3, n, date: dateStr(), ending,
    type: typeOf(stats),
    stats: stats.map(s => ({ title: s.title, meter: s.meter, tool: s.tool, n: s.n, awake: s.awake })),
    lands: CHAPTERS.map((ch, i) => {
      const land = (journey.lands || []).find(x => x.id === ch.id);
      const j = judged.find(x => x.land === ch.title);
      const u = pickUnderstood(ch, land, j && j.line);
      // 輪迴結局：這一趟在這塊土地沒做對任何事，就不寫「懂了」
      const line = ending === "真結局" || stats[i].n ? u.line : "";
      return { title: ch.title, tool: ch.tool, code: u.code, up: u.up, line };
    })
  };
}

function showSpread() {
  setChapter(FINALE); run = null; queue = [];
  updateHud();
  try { localStorage.removeItem(JOURNEY_KEY); } catch (e) {}
  if (!journey.counted) { journey.n = bumpJourneyCount(); journey.counted = true; }
  markEnded();
  const isTrue = journey.ending === "真結局";
  if (isTrue && !DEMO && !hasCleared()) toast("章節選單已開放：可以回到各章補齊圖鑑");
  if (isTrue) markCleared();
  if (!journey.record) { journey.record = buildRecord(journey.n); saveToWall(journey.record); saveJourney(); }
  showKeepsake(journey.record, true);
}

// ---------- 旅人原型：依這一趟在四塊土地做對的次數決定 ----------
// 文字為草稿，可自行改寫。art：之後有專屬插圖時放在 img/types/<id>.jpg，沒有就用 card 的牌面。
const TYPES = {
  fire:  { name: "點火的人",   card: "W01", el: "火", quote: "先燒起來，路就看得見了。",
           desc: "你相信行動比猶豫誠實。這一趟學會的不只是點火，還有怎麼讓火不燒到身邊的人。" },
  water: { name: "盛水的人",   card: "C01", el: "水", quote: "滿了，就讓它流出去。",
           desc: "你把感受當真。你知道杯子要先倒空一點，才裝得下別人。" },
  air:   { name: "說真話的人", card: "S01", el: "風", quote: "看清楚，比看起來好更重要。",
           desc: "你寧可痛一下，也不要模糊地過去。你學會把話說清楚，也學會什麼時候不說。" },
  earth: { name: "播種的人",   card: "P01", el: "土", quote: "慢慢長出來的，才拿得走。",
           desc: "你相信累積。一步一步耕下去，收成的時候，也記得分出去。" },
  fool:  { name: "還在路上的人", card: "M00", el: "空", quote: "什麼都沒帶，所以什麼都裝得下。",
           desc: "四塊土地你走得一樣深。你還沒決定自己是誰，這正是旅程最好的樣子。" }
};
const LAND_EL = { chiyuan: "fire", chenghu: "water", fengcheng: "air", jinsui: "earth" };

function journeyStats() {
  return CHAPTERS.map(ch => {
    const land = (journey && journey.lands || []).find(x => x.id === ch.id);
    return { id: ch.id, title: ch.title, meter: ch.meter, tool: ch.tool,
      n: land ? (land.learned || []).length : 0, awake: land ? !!land.awake : !!loadProgress(ch).awake };
  });
}
function typeOf(stats) {
  const max = Math.max(...stats.map(s => s.n));
  const top = stats.filter(s => s.n === max);
  return max > 0 && top.length === 1 ? LAND_EL[top[0].id] : "fool";
}
function keepsakeLines(rec) {
  return (rec.lands || []).filter(l => l.line).map(l => `在${l.title}，綾懂了：${endDot(l.line)}`);
}
function shareText(rec) {
  const T = TYPES[rec.type || "fool"];
  return `我在《我來異世界可不想再成為塔羅師》走完第 ${rec.n} 趟旅程，是「${T.name}」。\n「${T.quote}」\n你呢？ ${SHARE_URL}`;
}

    row2.appendChild(btnGhost("回到選單", () => { clearJourney(); showHome(); }));
  } else {
    row2.appendChild(btnGhost("回到回憶牆", showWall));
  }
  const cp = el("button", "btn ghost", "複製分享文字");

    catch (e) { toast("沒辦法自動複製，請手動複製連結"); }
  };
  row.appendChild(cp);

    cv = await drawKeepsake(rec);

    holder.appendChild(img);

  }
  if (cv) {
    const d = el("button", "btn primary", "下載圖片");
    d.onclick = () => saveCard(cv, `愚人之旅-第${rec.n}趟-${T.name}.png`);
    row.insertBefore(d, row.firstChild);

}

let _dl;
function downloadsCap() {
  if (_dl === undefined) {
    _dl = (window.claude && typeof window.claude.use === "function")
      ? Promise.resolve(window.claude.use("downloads")).catch(() => null)
      : Promise.resolve(null);
  }
  return _dl;
}
async function saveCard(cv, filename) {
  const blob = await new Promise(r => cv.toBlob(r, "image/png"));
  const dl = await downloadsCap();
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast("圖片已存好"); }
    catch (e) { if (!e || e.code !== "declined") toast("這裡沒辦法直接下載，請長按圖片另存"); }
    return;
  }
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { toast("請長按圖片另存"); }
}

// ---------- 分享卡繪製：1080 × 1920 直式（適合限時動態） ----------
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function wrapText(g, text, maxW) {
  const lines = []; let cur = "";
  for (const ch of text) {
    // 句讀不放行首：標點直接黏在上一行
    if (cur && g.measureText(cur + ch).width > maxW) {
      // 句讀不放行首：把上一行最後一個字一起帶下來
      if ("，。、！？」』：；）".includes(ch) && cur.length > 1) { lines.push(cur.slice(0, -1)); cur = cur.slice(-1) + ch; }
      else { lines.push(cur); cur = ch; }
    } else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}
function loadImg(src) {
  return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
}
let _qrLib;
function qrLib() {
  if (!_qrLib) _qrLib = new Promise(res => {
    if (window.qrcode) return res(window.qrcode);
    const sc = document.createElement("script");
    sc.src = "lib/qrcode.min.js";
    sc.onload = () => res(window.qrcode || null); sc.onerror = () => res(null);
    document.head.appendChild(sc);
    setTimeout(() => res(window.qrcode || null), 4000);
  });
  return _qrLib;
}
function drawQR(g, lib, text, x, y, size) {
  const qr = lib(0, "M"); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), pad = 2, cell = size / (n + pad * 2);
  g.fillStyle = "#f4ecdc"; roundRect(g, x, y, size, size, 10); g.fill();
  g.fillStyle = "#1a1722";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (qr.isDark(r, c)) g.fillRect(x + (c + pad) * cell, y + (r + pad) * cell, Math.ceil(cell), Math.ceil(cell));
}
function drawStar(g, cx, cy, r) {
  g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .28 : r; g.lineTo(cx + Math.cos(a - Math.PI / 2) * rr, cy + Math.sin(a - Math.PI / 2) * rr); }
  g.closePath(); g.fill();
}
const EL_COLOR = { fire: "#e0794a", water: "#5aa6c9", air: "#a8acd8", earth: "#a9b85a", fool: "#c9a774" };

async function drawKeepsake(rec) {
  const W = 1080, H = 1080, F = '"Iansui","Noto Serif TC","Songti TC",serif';
  const typeId = rec.type || "fool", T = TYPES[typeId], accent = EL_COLOR[typeId];
  const isTrue = (rec.ending || "真結局") === "真結局";
  const stats = rec.stats || [];
  // 卡片字型（芫荽）只載入卡上用到的字
  const allText = `愚人之旅第趟旅程真結局輪迴這一，你是元素皆衡${rec.n}${rec.date}${T.name}${T.quote}${T.desc}${nameOf(T.card)}「」・醒睡我來異世界可不想再成為塔羅師也走看自己哪種` + stats.map(s => s.title + s.meter + s.tool).join("") + SHARE_URL;
  try { if (document.fonts) { await document.fonts.load(`40px "Iansui"`, allText); await document.fonts.ready; } } catch (e) {}
  const [art, cardImg, lib] = await Promise.all([loadImg(`img/types/${typeId}.jpg`), loadImg(`img/cards/${T.card}.jpg`), qrLib()]);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  const fit = (text, max, size, weight = "") => { let s = size; do { g.font = `${weight}${s}px ${F}`; s -= 2; } while (g.measureText(text).width > max && s > 20); };

  // 背景：深紫夜空＋類型顏色光暈＋星點
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#2c2338"); bg.addColorStop(1, "#0d0b12");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const glow = g.createRadialGradient(270, 490, 30, 270, 490, 420);
  glow.addColorStop(0, accent + "66"); glow.addColorStop(1, accent + "00");
  g.fillStyle = glow; g.fillRect(0, 0, W, H);
  let seed = rec.n * 97 + 13; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  g.fillStyle = "rgba(240,234,219,.5)";
  for (let i = 0; i < 55; i++) { const r = rnd() * 2 + .4; g.beginPath(); g.arc(rnd() * W, rnd() * 760, r, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = "#c9a774"; drawStar(g, 1000, 250, 10); drawStar(g, 1010, 700, 7); drawStar(g, 62, 760, 9);

  // 雙框
  g.strokeStyle = "#c9a774"; g.lineWidth = 3; g.strokeRect(28, 28, W - 56, H - 56);
  g.lineWidth = 1; g.strokeRect(40, 40, W - 80, H - 80);

  // 左：塔羅牌（有專屬插圖時改用插圖）
  const cx = 290, top = 90, boxH = 640;
  if (art) {
    const s = 420, x = cx - s / 2, y = top + (boxH - s) / 2;
    g.save(); roundRect(g, x, y, s, s, 20); g.clip(); g.drawImage(art, x, y, s, s); g.restore();
    roundRect(g, x, y, s, s, 20); g.strokeStyle = "#c9a774"; g.lineWidth = 3; g.stroke();
  } else if (cardImg) {
    const h = boxH, w = Math.round(h * cardImg.width / cardImg.height), x = cx - w / 2;
    g.save(); g.shadowColor = accent; g.shadowBlur = 46;
    roundRect(g, x, top, w, h, 14); g.fillStyle = "#000"; g.fill(); g.restore();
    g.save(); roundRect(g, x, top, w, h, 14); g.clip(); g.drawImage(cardImg, x, top, w, h); g.restore();
    roundRect(g, x, top, w, h, 14); g.strokeStyle = "#c9a774"; g.lineWidth = 3; g.stroke();
  }

  // 右：遊戲標題、日期、結局、原型、語錄、描述
  const rx = 540, rw = W - 90 - rx;
  g.textAlign = "left";
  g.fillStyle = "#c9a774"; fit("我來異世界可不想再成為塔羅師", rw, 32); g.fillText("我來異世界可不想再成為塔羅師", rx, 128);
  g.fillStyle = "#c2b9a3"; g.font = `22px ${F}`; g.fillText(`第 ${rec.n} 趟旅程・${rec.date}`, rx, 168);
  const tag = isTrue ? "真結局" : "輪迴結局";
  g.font = `22px ${F}`; const tw = g.measureText(tag).width + 36;
  roundRect(g, rx, 192, tw, 38, 19);
  g.fillStyle = isTrue ? "#c9a774" : "rgba(255,255,255,.06)"; g.fill();
  g.strokeStyle = "#c9a774"; g.lineWidth = 2; g.stroke();
  g.fillStyle = isTrue ? "#1a1722" : "#c9a774"; g.fillText(tag, rx + 18, 219);
  g.fillStyle = "#c2b9a3"; g.font = `30px ${F}`; g.fillText("這一趟，你是", rx, 318);
  g.fillStyle = "#f6efe0"; fit(T.name, rw, 86); g.fillText(T.name, rx, 412);
  g.fillStyle = accent; g.font = `24px ${F}`;
  g.fillText(`${nameOf(T.card)}・${T.el === "空" ? "四元素皆衡" : T.el + "元素"}`, rx, 458);
  g.fillStyle = "#e8c27a";
  let y = 535;
  const q = `「${T.quote}」`;
  // 語錄稍微超出一行時縮小字級放成一行，太長才換行
  g.font = `30px ${F}`;
  if (g.measureText(q).width <= rw) { fit(q, rw, 36); g.fillText(q, rx, y); y += 52; }
  else { g.font = `36px ${F}`; wrapText(g, q, rw).slice(0, 3).forEach(l => { g.fillText(l, rx, y); y += 52; }); }
  g.fillStyle = "#d9d0bd"; g.font = `26px ${F}`; y += 14;
  wrapText(g, T.desc, rw).slice(0, 4).forEach(l => { g.fillText(l, rx, y); y += 42; });

  // 四塊土地：橫排四欄，標籤＋數字＋長條
  const by = 812, colW = (W - 180) / 4;
  g.strokeStyle = "rgba(201,167,116,.35)"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(90, by - 40); g.lineTo(W - 90, by - 40); g.stroke();
  stats.forEach((st, i) => {
    const x0 = 90 + i * colW, bw = colW - 30, elId = LAND_EL[CHAPTERS[i].id];
    g.textAlign = "left"; g.fillStyle = "#c2b9a3"; g.font = `22px ${F}`;
    g.fillText(`${st.title}・${st.meter}`, x0, by);
    g.textAlign = "right"; g.fillStyle = st.n ? "#f0eadb" : "#857d6c";
    g.fillText(`${st.n}/${THRESHOLD}`, x0 + bw, by);
    roundRect(g, x0, by + 18, bw, 14, 7); g.fillStyle = "rgba(255,255,255,.08)"; g.fill();
    const pct = Math.min(st.n / THRESHOLD, 1);
    if (pct > 0) { roundRect(g, x0, by + 18, Math.max(bw * pct, 14), 14, 7); g.fillStyle = EL_COLOR[elId]; g.fill(); }
  });

  // 底部：一句邀請＋QR
  const fy = 930;
  g.beginPath(); g.moveTo(90, fy - 46); g.lineTo(W - 90, fy - 46); g.strokeStyle = "rgba(201,167,116,.35)"; g.stroke();
  g.textAlign = "left"; g.fillStyle = "#c9a774"; g.font = `30px ${F}`;
  g.fillText("你也來走一趟，看看自己是哪一種人", 90, fy + 40);
  if (lib) { try { drawQR(g, lib, SHARE_URL, W - 90 - 110, fy - 28, 110); } catch (e) {} }
  return cv;
}

function showFeedback(back, rec) {
  run = null; queue = [];
  const s = stage();
  s.appendChild(el("div", "chapter-kicker", "回饋與問題"));
  s.appendChild(el("p", "lead", "心得、建議、遇到的錯誤，都可以告訴作者。"));
  const url = FEEDBACK_PAGE + (rec ? `?n=${rec.n}&ending=${encodeURIComponent(rec.ending)}` : "");
  const a = el("a", "btn primary", "打開回饋表單");
  a.href = url; a.target = "_blank"; a.rel = "noopener";
  const row = el("div", "btn-row");
  row.appendChild(a);
  row.appendChild(btnGhost("返回", back || showHome));
  s.appendChild(row);
  s.appendChild(el("p", "hint", "回饋頁會在新分頁打開。"));
}

// ---------- 隱私說明 ----------
function showPrivacy(back) {
  run = null; queue = [];
  const s = stage();
  s.appendChild(el("div", "chapter-kicker", "隱私說明"));
  const p = el("div", "panel privacy");
  p.innerHTML = `
    <p><b>不用註冊。</b>這個遊戲不會要你提供姓名、電話或 Email。</p>
    <p><b>進度只存在你的瀏覽器。</b>各章進度、圖鑑、輪數、回憶牆和紀念卡，都存在你這台裝置的瀏覽器裡（localStorage），不會上傳。換裝置、用無痕視窗，或清除瀏覽器資料，這些紀錄就會消失。</p>
    <p><b>你寫下的感悟只屬於你。</b>在審判牌自己寫的那句話，只存在你的瀏覽器裡，也只會出現在你自己的紀念卡上；要不要分享，由你決定。</p>
    <p><b>遊戲本身不傳送任何資料。</b></p>
    <p><b>字型、圖片都放在這個網站上。</b>遊戲不會連到其他網站載入字型或程式。</p>
    <p><b>沒有廣告，也沒有追蹤或分析工具。</b></p>
    <p><b>放遊戲的網站有自己的紀錄。</b>遊戲放在哪個網站上，那個網站本身可能留有連線紀錄，以該網站的隱私政策為準。</p>
    <p class="hint">最後更新：2026 年 11 月 11 日</p>`;
  s.appendChild(p);
  const row = el("div", "btn-row");
  row.appendChild(continueBtn("返回", back || showHome));
  const clr = el("button", "btn ghost", "清除所有遊戲資料");
  let armed = false;
  clr.onclick = () => {
    if (!armed) { armed = true; clr.textContent = "再按一次，確定清除"; return; }
    try { Object.keys(localStorage).filter(k => k.startsWith("tarot-")).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    Object.keys(memStores).forEach(k => delete memStores[k]);
    memWall = []; memCount = 0; memCleared = false; memEnded = false; journey = null;
    toast("所有遊戲資料都清除了");
    showHome();
  };
  row.appendChild(clr);
  s.appendChild(row);
}

function memoriesFor(t) {
  const p = loadProgress(t.chObj);
  const atts = [];
  Object.keys(p.solved || {}).forEach(id => {
    const ev = t.chObj.events[id];
    const o = ev && ev.options.find(x => x.s === 1);
    if (o && !atts.includes(o.att)) atts.push(o.att);
  });
  const picks = shuffle(atts).slice(0, 3);
  if (picks.length < 2) picks.push(FINALE.fallback[t.ch]);
  return picks;
}

function showJudgement() {
  const j = FINALE.judgement;
  const { s, txt } = majorScene(j.code);
  txt.appendChild(el("p", "narr", j.text));
  s.appendChild(el("p", "hint", j.prompt + "（選一句，或自己寫）"));
  const st = toolStatus();
  const chosen = {};
  const out = el("div", "outcome");
  const finishBtnRow = el("div", "btn-row");
  const check = () => {
    if (Object.keys(chosen).length < 4 || finishBtnRow.childElementCount) return;
    const b = continueBtn("讓四句話串起來", () => {
      b.disabled = true;
      const para = st.map(t => `在${t.land}，我學會了${chosen[t.ch]}。`).join("");
      run.judged = st.map(t => ({ land: t.land, line: chosen[t.ch] }));
      out.appendChild(el("p", "narr judged", para));
      out.appendChild(el("p", "narr", j.reveal));
      out.appendChild(el("div", "btn-row")).appendChild(continueBtn());
    });
    finishBtnRow.appendChild(b);
  };
  st.forEach(t => {
    const block = el("div", "judge-block");
    block.appendChild(el("div", "judge-land", `${t.land}`));
    const opts = el("div", "options");
    const pick = (text, btn) => {
      chosen[t.ch] = text;
      opts.querySelectorAll(".option").forEach(x => x.classList.toggle("picked", x === btn));
      check();
    };
    memoriesFor(t).forEach(m => {
      const b = el("button", "option", m);
      b.onclick = () => pick(m, b);
      opts.appendChild(b);
    });
    const own = el("div", "own");
    const inp = el("input", "own-input"); inp.placeholder = "或者，自己寫一句……"; inp.maxLength = 30;
    const ob = el("button", "btn ghost small", "用這句");
    ob.onclick = () => { const v = inp.value.trim(); if (v) pick(v, null); };
    own.appendChild(inp); own.appendChild(ob);
    block.appendChild(opts); block.appendChild(own);
    s.appendChild(block);
  });
  s.appendChild(finishBtnRow);
  s.appendChild(out);
}

function showWorld() {
  const w = FINALE.world;
  const { s, txt } = majorScene(w.code);
  txt.appendChild(el("p", "narr", w.text));
  const box = el("div", "ending awake");
  box.appendChild(el("div", "ending-tag", "尾聲"));
  box.appendChild(el("p", "narr", w.epilogue));
  s.appendChild(box);
  s.appendChild(el("div", "step-label", "這一趟旅程的牌陣"));
  const list = el("div", "summary");
  (run.judged || []).forEach(j => {
    list.appendChild(el("div", "sum-row", `<span class="sum-card">${j.land}</span><span class="sum-att">${j.line}</span>`));
  });
  s.appendChild(list);
  s.appendChild(el("p", "lead small", "結局：真結局"));
  if (journey) {
    journey.finale = ["M10", "M16", "M12", "M03", "M19", "M20", "M21"]; journey.ending = "真結局"; journey.judged = run.judged; saveJourney();
    s.appendChild(el("div", "btn-row")).appendChild(continueBtn("看這趟旅程的紀念卡", showSpread));
    return;
  }
  const row = el("div", "btn-row");
  row.appendChild(continueBtn("回到章節選單", showHome));
  s.appendChild(row);
}
