<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>來異世界找塔羅師</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* ===== 與《我來異世界可不想再成為塔羅師》同一套外觀 ===== */
:root{
  --bg:#1c1410; --bg2:#26190f; --ink:#f1e6d6; --ink2:#c9b59c; --muted:#8c7a66;
  --ember:#e0693a; --ember2:#f2a35c; --gold:#e8c27a; --line:#4a3424; --card:#f4e9d6; --card-ink:#3a2618;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif; --hand:"Iansui","Noto Serif TC",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(ellipse at 50% -10%,#3b2112 0%,var(--bg) 55%) fixed;color:var(--ink);
  font-family:var(--serif);line-height:1.85;min-height:100vh}
button{font-family:inherit}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:5;background:rgba(28,20,16,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:14px;color:var(--ink2)}
.spacer{flex:1}
.tool{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:12px;padding:2px 8px;border-radius:8px;cursor:pointer}
.tool:hover{color:var(--ink2)}
.tool.on{color:var(--gold);border-color:var(--gold)}
#where{color:var(--ink2)}
#testbar{display:none;flex-basis:100%;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px}
body.test #testbar{display:flex}
#testbar select{font:inherit;font-size:12px;background:var(--bg2);color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:1px 4px}
main{max-width:680px;margin:0 auto;padding:28px 18px 80px}
main.wide{max-width:900px}
#stage{animation:fade .4s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.chapter-kicker{color:var(--ember2);letter-spacing:.4em;font-size:14px;margin-top:20px}
.lead{color:var(--ink2);font-size:18px}
.home-title{font-size:30px;margin:6px 0 0;letter-spacing:.08em}
.home-intro{max-width:560px;margin:6px 0 18px;color:var(--ink2);font-size:15px;line-height:1.9}
.home-intro p{margin:6px 0}
.home-hero{display:block;width:100%;max-width:640px;margin:0 auto 14px;border-radius:12px;border:1px solid var(--line);aspect-ratio:1299/833;object-fit:cover}
.cover-hero{position:relative;max-width:760px;margin:10px auto 18px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.cover-hero img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.cover-ov{position:absolute;left:0;right:0;bottom:0;padding:70px 24px 18px;background:linear-gradient(180deg,rgba(12,9,14,0) 0%,rgba(12,9,14,.55) 40%,rgba(12,9,14,.85) 100%)}
.cover-title{margin:0;font-size:clamp(36px,8vw,56px);letter-spacing:.2em;color:#fff8ec;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.cover-lead{margin:4px 0 0;font-size:clamp(14px,3.6vw,18px);color:#f3e6cf;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.panel{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:6px 18px;color:var(--ink2);font-size:15px}
.panel b{color:var(--ink)}
.step-label{font-size:13px;letter-spacing:.25em;color:var(--ember2);margin-bottom:14px}
.step-label .n{color:var(--muted);letter-spacing:.1em;margin-left:8px}
.narr{font-size:17px;margin:0 0 12px}
.hint{color:var(--muted);font-size:13px}
.hint.center{text-align:center}
.btn-row{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.btn{font:inherit;font-size:16px;padding:10px 26px;border-radius:24px;cursor:pointer;border:1px solid var(--ember)}
.btn.primary{background:linear-gradient(180deg,#e0693a,#b84a24);color:#fff8ef;border-color:#b84a24}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:none;color:var(--ink2);border-color:var(--line)}
.btn.small{font-size:13px;padding:6px 14px}
.btn:disabled{opacity:.4;cursor:default;filter:none}
a.btn{text-decoration:none;display:inline-block}
/* 對話：頭像＋台詞 */
.say{display:flex;gap:12px;align-items:flex-start;margin:0 0 14px}
.say .av{flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;border:1px solid var(--ember2);background:linear-gradient(180deg,#4a2615,#2b170d);
  display:grid;place-items:center;color:var(--ember2);font-size:15px;font-weight:700}
.say .av img{width:100%;height:100%;object-fit:cover;display:block}
.say.has-bust{align-items:flex-end;gap:6px;margin:4px 0 16px}
.say.has-bust>div:last-child{flex:1;padding:8px 14px 10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:6px}
.say .bust{flex:none;width:120px;height:160px;overflow:hidden;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));
  -webkit-mask-image:linear-gradient(180deg,#000 78%,transparent);mask-image:linear-gradient(180deg,#000 78%,transparent)}
.say .bust img{width:100%;height:auto;min-height:100%;object-fit:cover;object-position:50% 0;display:block;transform:scale(1.35);transform-origin:50% 0}
@media (max-width:520px){.say .bust{width:92px;height:124px}}
.say .av.you{border-color:var(--gold);color:var(--gold)}
.say .who{font-size:13px;color:var(--ember2);letter-spacing:.08em;line-height:1.4}
.say .how{color:var(--muted);font-size:12px;margin-left:6px;letter-spacing:0}
.say p{margin:2px 0 0;font-size:17px}
/* 選項 */
.options{display:flex;flex-direction:column;gap:10px;margin:20px 0 4px}
.option{font:inherit;font-size:16px;text-align:left;padding:12px 16px;border-radius:10px;cursor:pointer;
  background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line);transition:all .2s}
.option:hover:not(:disabled){border-color:var(--ember2);background:rgba(224,105,58,.08)}
.option.picked{border-color:var(--ember2);background:rgba(224,105,58,.14)}
.option.faded{opacity:.35}
.option:disabled{cursor:default}
.outcome{margin-top:16px}
/* 測試用標記 */
.tags{display:none;gap:4px;flex-wrap:wrap;margin-left:6px;vertical-align:middle}
body.test .tags{display:inline-flex}
.tag{font-size:11px;line-height:1.5;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:rgba(255,255,255,.04)}
.tag.over{color:#f0a088;border-color:#7a3a28}.tag.under{color:#8fc2e6;border-color:#2f5a7a}.tag.mid{color:#a9d18b;border-color:#4c6b39}
.note{display:none;font-size:13px;color:#a9d18b;border-left:3px solid #4c6b39;padding:4px 10px;margin:0 0 12px;background:rgba(169,209,139,.06);border-radius:0 6px 6px 0}
body.test .note{display:block}
.dbg{display:none;font-size:12px;color:var(--muted);white-space:pre-wrap;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
body.test .dbg{display:block}
/* 章節卡片（主題選單） */
.chapters{display:grid;gap:14px;margin-top:20px}
.chapter-card{font:inherit;text-align:left;cursor:pointer;border-radius:14px;padding:18px 20px;border:1px solid;transition:transform .2s;overflow:hidden}
.chapter-card:hover{transform:translateY(-3px)}
.chapter-card.theme-fire{background:linear-gradient(135deg,#3a1d10,#1f140e);border-color:#7a4a2a;color:#f1e6d6}
.chapter-card.theme-water{background:linear-gradient(135deg,#123247,#0e1820);border-color:#2f6f8f;color:#e3eef3}
.chapter-card.theme-air{background:linear-gradient(135deg,#262a44,#15161d);border-color:#555b8f;color:#eceef6}
.chapter-card.theme-earth{background:linear-gradient(135deg,#2f3518,#14170f);border-color:#6d7a36;color:#eee9d6}
.cc-cover{display:block;width:calc(100% + 40px);margin:-18px -20px 12px;height:120px;object-fit:cover;border-radius:14px 14px 0 0;opacity:.9}
.cc-kicker{font-size:13px;letter-spacing:.3em;opacity:.7}
.cc-title{font-size:32px;font-weight:700;letter-spacing:.2em}
.cc-lead{opacity:.85}
/* 狀態按鈕 */
.states{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 6px}
@media (max-width:420px){.states{grid-template-columns:1fr}}
.state-btn{font:inherit;font-size:17px;padding:14px 12px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line);transition:all .2s;letter-spacing:.1em}
.state-btn:hover{border-color:var(--ember2);background:rgba(224,105,58,.1)}
/* 出發前設定 */
.q{margin:0 0 22px}
.q .t{display:block;font-weight:600;margin-bottom:8px}
.q .hint{margin-top:6px;line-height:1.6}
.own-input{width:100%;font:inherit;font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink)}
textarea.own-input{min-height:76px;resize:vertical}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:inherit;font-size:15px;padding:6px 16px;border-radius:999px;cursor:pointer;background:rgba(255,255,255,.04);color:var(--ink2);border:1px solid var(--line)}
.pill[aria-pressed="true"]{border-color:var(--ember2);color:var(--ink);background:rgba(224,105,58,.18)}
/* 牌 */
.card-row{display:flex;gap:22px;justify-content:center;margin:20px 0 40px;flex-wrap:wrap}
.card-slot{display:flex;flex-direction:column;align-items:center;gap:8px}
.slot-cap{font-size:13px;color:var(--muted);letter-spacing:.2em}
.card{width:112px;height:187px;border-radius:8px;position:relative;flex:none}
.card.back{background:#5a2b16;border:2px solid #8a4a2a;box-shadow:0 6px 16px rgba(0,0,0,.4);cursor:pointer;transition:transform .2s}
.card.back:hover{transform:translateY(-6px);box-shadow:0 10px 22px rgba(224,105,58,.35)}
.back-pattern{position:absolute;inset:8px;border:1px solid rgba(242,163,92,.5);border-radius:6px;
  background:repeating-linear-gradient(45deg,rgba(242,163,92,.12) 0 6px,transparent 6px 12px)}
.card.face{background:#f4ecd8;border:2px solid #c9a774;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.card.face.major{border-color:var(--gold)}
.card-art{position:absolute;inset:0;border-radius:6px;overflow:hidden;transition:transform .3s}
.card-art img{width:100%;height:100%;object-fit:cover;display:block}
.card.reversed .card-art{transform:rotate(180deg)}
.card-cap{position:absolute;bottom:-26px;left:-24px;right:-24px;text-align:center;font-size:12px;color:var(--ink2);letter-spacing:.08em;white-space:nowrap}
.card.reversed .card-cap .o{color:#e88a7a}
.flip-in{animation:flip .45s}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
.reading{margin-top:10px}
.reading .say p{line-height:1.95;margin:2px 0 10px}
.ending-box{padding-top:14px!important}
.paid-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.ending-box{border:1px solid var(--gold);border-radius:14px;padding:6px 18px 14px;box-shadow:0 0 40px rgba(232,194,122,.12) inset;margin-top:8px}
.carry{font-size:14px;color:var(--ink2);margin:6px 0}
.carry b{color:var(--muted);font-weight:400;margin-right:8px;font-size:12px;letter-spacing:.1em}
.log{list-style:none;padding:0;margin:8px 0 0;font-size:14px}
.log li{padding:6px 0;border-top:1px dashed var(--line);color:var(--ink2)}
.log .et{display:block;font-size:11px;letter-spacing:.15em;color:var(--ember2)}
/* 手機上三張牌排成一排（2026-11-23） */
@media (max-width:520px){
  .card-row{gap:12px;flex-wrap:nowrap}
  .card-row .card{width:calc((100vw - 36px - 24px) / 3);max-width:112px;height:auto;aspect-ratio:112/187}
  .card-row .card-cap{font-size:11px;letter-spacing:0}
}
.text-links{display:flex;gap:22px;justify-content:center;margin:18px 0 6px}
.link{font:inherit;font-size:15px;background:none;border:0;color:var(--ink2);text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:6px 2px}
.link:hover{color:var(--ink)}
.keep-holder{display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0 0}
.keep-holder:empty{display:none}
.keep-img{width:100%;max-width:min(420px,calc((100svh - 150px) * .5625));border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.testonly{display:none}
body.test .testonly{display:block}
body.test .btn.testonly{display:inline-block}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#3a2214;border:1px solid var(--gold);color:var(--gold);
  padding:8px 18px;border-radius:20px;opacity:0;pointer-events:none;z-index:30}
#toast.show{animation:toast 2.4s}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
.home-foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:34px}
/* ===== 共同主頁 ===== */
@font-face{font-family:"ArcGV";src:url(fonts/script/great-vibes-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"ArcAB";src:url(fonts/script/alex-brush-latin-400-normal.woff2) format("woff2");font-display:swap}
.portal-head .arc-wrap{position:relative;display:inline-block}
.portal-head .arc-streak{position:absolute;left:-4%;top:6%;width:108%;height:96%;overflow:visible;pointer-events:none}
.arc-streak path{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:0;
  animation:arcStreak 2.6s cubic-bezier(.45,.05,.35,1) .7s 1 both}
.arc-streak .s1{stroke:#fffaf0;stroke-width:2.2;stroke-dasharray:5 200}
.arc-streak .s2{stroke:#ffe1a0;stroke-width:1.4;stroke-dasharray:14 200;filter:drop-shadow(0 0 4px rgba(255,214,150,.9))}
.arc-streak .s3{stroke:rgba(255,214,150,.5);stroke-width:.9;stroke-dasharray:30 200}
@keyframes arcStreak{0%{stroke-dashoffset:5;opacity:0}12%{opacity:1}72%{opacity:.9}100%{stroke-dashoffset:-104;opacity:0}}
.arc-streak .s2{animation-name:arcStreak2}.arc-streak .s3{animation-name:arcStreak3}
@keyframes arcStreak2{0%{stroke-dashoffset:14;opacity:0}12%{opacity:.9}72%{opacity:.7}100%{stroke-dashoffset:-95;opacity:0}}
@keyframes arcStreak3{0%{stroke-dashoffset:30;opacity:0}12%{opacity:.7}72%{opacity:.45}100%{stroke-dashoffset:-79;opacity:0}}
@media (prefers-reduced-motion:reduce){.arc-streak{display:none}}
.portal-head .arc-en{font-family:"ArcGV",cursive;font-size:clamp(48px,11vw,84px);line-height:1.25;margin:2px 0 0;padding:.25em .2em .1em;
  background:linear-gradient(180deg,#fff3c8 0%,#e8c27a 55%,#b8863a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(255,205,120,.45))}
.portal-head .arc-en .arc-a{font-family:"ArcAB",cursive;font-size:1.02em}
.portal-head{text-align:center;margin:18px 0 26px}
.portal-head h1{font-family:var(--hand);font-weight:400;font-size:clamp(34px,7vw,52px);letter-spacing:.12em;margin:0;color:#fff8ec}
.portal-head p{color:var(--ink2);margin:2px 0 0;font-size:16px;letter-spacing:.3em}
body[data-theme="portal"]{--bg:#070b1c;--bg2:#0f1630;--ink:#f1e6d6;--ink2:#c9d6ee;--muted:#8f9bb6;--ember:#b8913f;--ember2:#e3c172;--gold:#e8c27a;--line:rgba(232,194,122,.45);
  background:#070b1c url(img/portal_sky.jpg) center bottom/cover no-repeat fixed}
body[data-theme="portal"] header{background:rgba(7,11,28,.85)}
.portal-head h1{text-shadow:0 2px 24px rgba(80,140,255,.45)}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:40px}
@media (max-width:720px){.doors{grid-template-columns:1fr;gap:16px;margin-top:28px}}
.door{display:flex;align-items:center;gap:24px;padding:22px 24px;border-radius:20px;text-decoration:none;text-align:left;width:100%;font:inherit;cursor:pointer;
  background:rgba(6,10,26,.72);border:1px solid rgba(232,194,122,.45);box-shadow:0 14px 40px rgba(0,0,0,.5);color:#fff8ec;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);transition:transform .25s,border-color .25s,box-shadow .25s}
.door:hover,.door:focus-visible{transform:translateY(-3px);border-color:#e8c27a;box-shadow:0 18px 44px rgba(0,0,0,.6),0 0 0 1px rgba(232,194,122,.35);outline:none}
.door .d-art{display:block;flex:none;width:104px;height:174px;position:relative}
.door .d-fool{display:block;width:100%;height:100%;border-radius:8px;background:#f4e9d6;padding:5px;box-sizing:border-box;transform:rotate(-5deg);box-shadow:0 10px 24px rgba(0,0,0,.55);transition:transform .3s}
.door .d-fool img{width:100%;height:100%;object-fit:cover;border-radius:5px;display:block}
.door:hover .d-fool{transform:rotate(-1deg) translateY(-3px)}
.door .d-fan i{position:absolute;left:22px;top:30px;width:60px;height:100px;border-radius:7px;box-sizing:border-box;border:2px solid #e8c27a;
  background:radial-gradient(circle at 50% 45%,#2c3f86 0%,#141c45 70%);box-shadow:0 6px 14px rgba(0,0,0,.55);transform-origin:50% 100%;transition:transform .3s;
  display:flex;align-items:center;justify-content:center;color:#e8c27a;font-style:normal;font-size:22px}
.door .d-fan i::after{content:"✦"}
.door .d-fan i:nth-child(1){transform:rotate(-16deg) translateX(-10px)}
.door .d-fan i:nth-child(2){transform:translateY(-6px)}
.door .d-fan i:nth-child(3){transform:rotate(16deg) translateX(10px)}
.door:hover .d-fan i:nth-child(1){transform:rotate(-22deg) translateX(-14px)}
.door:hover .d-fan i:nth-child(3){transform:rotate(22deg) translateX(14px)}
.door .d-txt{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.door .d-kick{font-size:13px;letter-spacing:.3em;color:#e8c27a}
.door .d-title{font-size:clamp(21px,2.4vw,26px);font-weight:700;line-height:1.35}
.door .d-sub{font-size:14px;line-height:1.65;color:#b9c4da}
@media (max-width:420px){.door{gap:14px;padding:18px}.door .d-art{width:88px;height:148px}.door .d-fan{transform:scale(.85);transform-origin:0 50%}}
body[data-theme="portal"] main{max-width:1120px;min-height:100vh;min-height:100svh;box-sizing:border-box;display:flex;flex-direction:column;padding-top:clamp(36px,9vh,100px);padding-bottom:22px}
body[data-theme="portal"] #stage{flex:1;display:flex;flex-direction:column}
body[data-theme="portal"] .doors{margin-top:auto;grid-template-columns:repeat(2,minmax(0,500px));justify-content:center;gap:40px;padding-top:40px}
@media (max-width:720px){body[data-theme="portal"] .doors{grid-template-columns:1fr;gap:16px;padding-top:28px}}
body[data-theme="portal"] .portal-foot{margin-top:56px}
@media (max-width:720px){body[data-theme="portal"] .portal-foot{margin-top:28px}}
#privacy{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:18px}
#privacy[hidden]{display:none}
#privacy .pbox{max-width:520px;background:#0f1630;border:1px solid rgba(232,194,122,.45);border-radius:16px;padding:24px 26px;color:#e6ddcf;line-height:1.8;font-size:15px}
#privacy h3{margin:0 0 10px;color:#e8c27a;font-weight:600}
#privacy ul{margin:0 0 14px;padding-left:20px}
.portal-foot{text-align:center;margin-top:36px}
.portal-foot a,.portal-foot button{color:#8f9bb6;font-size:13px;background:none;border:0;cursor:pointer;text-decoration:none}
.gates{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:620px){.gates{grid-template-columns:1fr}}
.gate{position:relative;display:block;border-radius:14px;overflow:hidden;border:1px solid var(--line);text-decoration:none;color:#fff8ec;
  box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .25s,box-shadow .25s,border-color .25s;cursor:pointer;background:#000;font:inherit;padding:0;text-align:left;width:100%}
.gate:hover,.gate:focus-visible{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 14px 36px rgba(0,0,0,.55),0 0 0 1px rgba(232,194,122,.35);outline:none}
.gate img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;transition:transform .6s,filter .3s;filter:brightness(.82)}
.gate:hover img{transform:scale(1.04);filter:brightness(.95)}
.gate .gov{position:absolute;left:0;right:0;bottom:0;padding:90px 22px 22px;background:linear-gradient(180deg,rgba(10,7,12,0) 0%,rgba(10,7,12,.6) 45%,rgba(10,7,12,.9) 100%)}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
function stage(){ const s = $("#stage"); s.innerHTML = ""; window.scrollTo(0,0); return s; }
function theme(t){ document.body.dataset.theme = t; }

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function tagClass(t){ return t.startsWith("過頭")?"over":t.startsWith("不足")?"under":t.startsWith("中道")?"mid":""; }
function tagsHTML(tags){ return tags&&tags.length ? `<span class="tags">${tags.map(t=>`<span class="tag ${tagClass(t)}">${esc(t)}</span>`).join("")}</span>` : ""; }
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||"null"); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }

// 測試開關（2026-11-23）：公開畫面不顯示。要用時，在頂端的地點文字上連點 5 下，按鈕就會出現（只記在這台瀏覽器）。

{ let taps = 0, timer = 0;

  }); }

applyTest();

function pickVariant(b){
  if(b.items.some(it=>it.warm)) return {items: b.items.filter(it=>it.warm===PROFILE.warm), all:false};
  const hit = c => S.log.some(l=>l.num===c.ev && l.tags.some(t=>c.tags.includes(t)));
  const played = c => S.log.some(l=>l.num===c.ev);
  for(const it of b.items){ if(it.cond && it.cond.some(hit)) return {items:[it], all:false}; }
  const anyPlayed = b.items.some(it=>it.cond && it.cond.some(played));
  if(anyPlayed){ const d = b.items.find(it=>!it.cond); return {items: d?[d]:[], all:false}; }

  for(; bi < ev.blocks.length; bi++){

      continue;

    if(b.t === "variants"){
      const {items, all} = pickVariant(b);
      if(all) box.appendChild(el("div","note","沒有走到條件裡的事件，下面列出所有版本"));
      items.forEach(it => { box.appendChild(el("div","note","依選擇顯示："+esc(it.label))); const e = blockEl(it.block); if(e) box.appendChild(e); });

function showChoice(ev, bi, box){
  const b = ev.blocks[bi];
  const hit = c => S.log.some(l=>l.num===c.ev && l.tags.some(t=>c.tags.includes(t)));
  const played = c => S.log.some(l=>l.num===c.ev);
  const condOpts = b.opts.filter(o=>o.cond);
  const anyHit = condOpts.some(o=>o.cond.some(hit));
  const anyPlayed = condOpts.some(o=>o.cond.some(played));
  const order = shuffle(b.opts.map((o,i)=>i).filter(i=>{ const o=b.opts[i];
    if(!condOpts.length || !anyPlayed) return true;
    if(o.cond) return o.cond.some(hit);
    if(o.other) return !anyHit;
    return true; }));
  const opts = el("div", "options"); const out = el("div", "outcome");

    btns.push(btn); opts.appendChild(btn);
  });
  box.appendChild(opts); box.appendChild(out);
  pending = null; choosing = btns;
}

// 三張牌解牌框架
//   資料來源：通用牌義（data.js 的 MEANINGS＋這裡的 READ_DB 擴充欄位，之後換成 cards.jsonl）為主，
//   案例解牌（readings.jsonl）為輔，尚未接入。教學課程的資料不用在解牌。
//   大前提：來的人都帶著問題。他問什麼，就代表那一塊卡住了。
//   ① 現況＝問題本身：用這張牌說明「他為什麼會處在這個問題裡」
//   ② 盲點＝阻礙：接著現況說，為什麼這個問題一直解決不了
//   ③ 建議＝解法：同時回應現況和盲點，該怎麼走出來
// ----------------------------------------------------------------
// READ_DB[牌名][up|rv] 的欄位（每個欄位都可以是字串，或用狀態／主題分開寫的物件）：
//   img    牌面畫面（共用，寫在牌名底下；目前只當參考，不會自動印出）
//   now    當「現況」時：這張牌怎麼解釋他的問題
//   why    當「現況」時：他會停在這裡的原因／目的，給盲點那段接話用
//   block  當「盲點」時：阻礙是什麼
//   advice 當「建議」時：該怎麼做
//   free   當「建議」時：要放下的想法（可省略）
//   echo   當「盲點」時：怎麼回扣旅程裡的行為（{ev} 會換成玩家的行為標籤，如「查證、試探」）

    "這張牌就算倒過來，也沒有好轉的意思。說出來不好聽，但先做好最壞的打算，接下來不管怎樣，你都接得住。",
    "這張牌倒過來，不代表事情會變好。你要有心理準備，先想好最糟的情況，心裡反而會比較踏實。" ],

    x=>`這張牌倒過來出現在建議，是在幫你先做心理準備：${x}。說出來不好聽，但先有最壞的打算，你才不會被突然打亂。`,
    x=>`建議牌是逆位，牌在提醒你，最壞的情況可能是：${x}。先把這一點想好，接下來不管怎樣，你都接得住。`,
    x=>`逆位的建議，比較像一句提醒：要有「${x}」的心理準備。不是要嚇你，先想好最糟的情況，心裡反而會比較踏實。` ]

function composeReading({cards, state, topic, area, landKey, q, clue, ev, fits, main, f}){
  const [[c1,r1],[c2,r2],[c3,r3]] = cards;
  const side = (c,r) => (READ_DB[c] && READ_DB[c][r?"rv":"up"]) || {};
  const get = (c,r,k) => dbPick(side(c,r)[k], state, topic);
  const head = (pos,c,r) => `${pos}是${r?"逆位的":""}${dn(c)}。`;
  const isCourt = c => /(侍衛|騎士|皇后|國王)$/.test(c);
  const src = [];
  const echoTpl = get(c2,r2,"echo");
  const evAt = !ev ? "" : (echoTpl || !fits) ? "blind" : "now";
  // ① 現況：問題本身
  let L1 = head("現況",c1,r1);
  if(!r1 && HEAVY.has(c1)) L1 += pick(V.heavyNow);   // 重牌先同理
  const nowTxt = get(c1,r1,"now"), mild1 = r1 ? get(c1,r1,"mild") : "";   // N26：現況不解成逆位轉好
  const nowCase = !nowTxt && !mild1 && !f.nowConnected ? caseLine(c1,r1,"now",landKey) : "";
  if(nowTxt){ src.push("現況＝資料庫"); L1 += nowTxt; }
  else if(mild1){ src.push("現況＝逆位減輕"); L1 += mild1; }
  else if(nowCase){ src.push("現況＝案例（牌義接不回主題）"); L1 += nowCase; if(Math.random() < .6) L1 += pick(V.bridge)(area); }
  else { src.push("現況＝牌義庫"); L1 += f.nowState + "。"; if(Math.random() < .6) L1 += pick(V.bridge)(area); }
  if(evAt==="now") L1 += pick(V.evFit)(ev);
  // ② 盲點：原因（正位＝他以為沒問題；逆位＝他隱約感覺到）
  const why = get(c1,r1,"why");
  const blockTxt = get(c2,r2,"block"), mild2 = r2 ? get(c2,r2,"mild") : "";
  let L2 = head("盲點",c2,r2);
  if(blockTxt){ src.push(why ? "盲點＝資料庫（接現況）" : "盲點＝資料庫"); L2 += (why ? `對照前面的${dn(c1)}，${why}。` : "") + blockTxt; }
  else {
    src.push("盲點＝牌義庫");
    if(mild2) L2 += pick(V.blindRv)(mild2.replace(/。$/,""));
    else if(!r2 && f.blindPos) L2 += pick(V.blindGood)(f.blindState) + (isCourt(c2) ? pick(V.courtTrait) : (f.blindDom || ""));
    else {
      const bCase = f.blindPolNonNeg ? caseLine(c2,r2,"blind",landKey) : "";
      if(bCase){ src.push("盲點＝案例（牌義偏正面）"); }
      L2 += pick(r2 ? V.blindRv : V.blindUp)((bCase || f.blindState + "。").replace(/。$/,""));
      const ts = TOPIC_SUIT[landKey] && TOPIC_SUIT[landKey][suitOf(c2)];
      if(ts && Math.random() < .7){ L2 += pick(V.topicSuit)(area, ts); src.push("主題×花色"); }
      else L2 += pick(V.blindNeg)(area);
    }
  }
  if(evAt==="blind") L2 += echoTpl ? echoTpl.replace("{ev}", ev) : pick(V.evEcho)(ev);
  L2 += clue || "";
  // ③ 建議：解法（回應現況或盲點）
  const advTxt = get(c3,r3,"advice"), turn3 = r3 ? get(c3,r3,"turn") : "", mild3 = r3 ? get(c3,r3,"mild") : "";
  const noGood = r3 && HEAVY.has(c3);   // N27：逆位又缺乏正向解法（重牌逆位）→ 最壞打算；其他逆位往正向解
  const advCase = !advTxt && !r3 && f.advOff ? caseLine(c3,r3,"adv",landKey) : "";
  let L3 = head("建議",c3,r3);
  if(advTxt){ src.push("建議＝資料庫"); L3 += advTxt + get(c3,r3,"free") + get(c3,r3,"echo"); }
  else if(r3 && noGood){ src.push("建議＝逆位：做最壞的打算"); L3 += mild3 ? `要做好最壞的打算：${mild3}` : HEAVY.has(c3) ? pick(V.revHeavy) : pick(V.revAdv)(f.advState); }
  else if(turn3){ src.push("建議＝逆位轉好（鼓勵）"); L3 += turn3 + (f.tailFixed || pick(V.tail[main])); }
  else if(advCase){ src.push("建議＝案例（牌義講到別的主題）"); L3 += advCase + (f.tailFixed || pick(V.tail[main])); }
  else {
    src.push(r3 ? "建議＝牌義庫（逆位往正向解）" : "建議＝牌義庫"); L3 += (r3 ? f.advPos : f.advAdvice) + "。";
    const sB = solves(f.advTags, f.blindTags), sN = solves(f.advTags, f.nowTags);
    if(sB || sN){ L3 += sB >= sN ? pick(V.toBlind) : pick(V.toNow)(f.nowName); src.push(sB >= sN ? "建議解盲點" : "建議解現況"); }
    L3 += (f.tailFixed || pick(V.tail[main])) + f.img;
  }
  const qq = q ? `，你問：「${q}」` : "";
  const lines = [pick(V.open)(topic, state, qq), L1, L2, L3];
  // 建議那段不是用牌義庫的說法時，回答就不要引用牌義庫的建議句，免得兩段講不一樣
  let qAns = f.qAns;
  if(qAns && !src.some(x=>x.startsWith("建議＝牌義庫")) && f.advS) qAns = qAns.split(f.advS).join("建議牌說的那一步");
  if(q && qAns) lines.push(`所以，你問「${q}」，牌的回答是：${qAns}`);
  if(!q) lines.push(pick(V.closeNoQ)(area));
  return {lines, src: src.join("・") + (ev ? `・旅程證據放在${evAt==="now"?"現況":"盲點"}` : "")};
}

// 玩家自己打的問題 → 問題類型（用字詞判斷）
const qTypeOf = q => /喜不喜歡|在想什麼|怎麼想|生我的氣|怎麼看我|為什麼不理|在不在乎|愛不愛/.test(q) ? "對方怎麼想" : /什麼時候|多久/.test(q) ? "什麼時候"
  : /該不該|要不要|應不應該/.test(q) ? "要不要" : /怎麼|如何/.test(q) ? "怎麼做" : /是不是/.test(q) ? "是不是" : /會不會|能不能|可不可能|會成功|值得|走下去|理解|有沒有機會|有結果/.test(q) ? "會不會" : "";
function ayaRead(cards){
  const cnt={"過頭":0,"不足":0,"中道":0}, labels={"過頭":[],"不足":[],"中道":[]};
  let clue="", clueAns="";
  S.log.forEach(l=>l.tags.forEach(t=>{
    const [k,lab]=t.split("・");
    if(k in cnt){ cnt[k]++; if(lab) labels[k].push(lab); }
    const m=t.match(/^盲點線索：(.+)$/); if(m){ clue=m[1]; clueAns=fill(l.text).replace(/^「|」$/g,"").replace(/。$/,"").replace(/[『』]/g,"").replace(/^…+/,""); }
  }));
  const main = Object.keys(cnt).reduce((a,b)=>cnt[b]>cnt[a]?b:a);
  const q = (PROFILE.question||"").trim();
  const qw = mergeW(...QWORDS.filter(([re])=>q&&re.test(q)).map(x=>x[1]));
  const base = mergeW(TOPIC_W[S.land.key], qw);
  const [[c1,r1],[c2,r2],[c3,r3]] = cards;
  const blindCtx = -1 + .5*cardTone(c2,r2);
  const ctxNow = 2*blindCtx + .5*cardTone(c3,r3);
  const ctxBlind = -1;
  const ctxAdv = cardTone(c1,r1) + blindCtx;
  const now = pickFacet(c1,r1,mergeW(base,TEND_NOW[main]),ctxNow);
  const blind = pickFacet(c2,r2,mergeW(base,SHADOW,CLUE[clue],CLUE[clue]),ctxBlind);
  const adv = pickFacet(c3,r3,mergeW(base,TEND_ADV[main]),ctxAdv);
  const mode = (r,ctx)=> r ? (ctx<0?"逆位偏負面（加重／還沒做到）":"逆位偏逆轉（轉好）") : "";
  const o = r=>r?"逆位的":"";
  const queen = QUEEN[S.land.key];
  const ev = [...new Set(labels[main])].slice(0,2).join("、");
  const fits = now.tags.some(x=>TEND_NOW[main][x]);
  const area = AREA[S.land.key], res = RES[S.land.key];
  // ---- 牌義庫的原料（交給 composeReading 依原則組句）----
  const dom = domainOf(c2);
  const blindDom = (blind.pol>0 && dom) ? `這就是你${area}的關鍵：你把${res}都${PUT[S.land.key]}${dom}上了。` : "";
  // 提醒句、比喻句跟著建議牌的方向（2026-11-21 修正：原本會一句叫你衝、一句叫你慢）
  const kind0 = adv.tags.some(x=>["steady","wait","rest"].includes(x)) ? "keep" : adv.tags.some(x=>["act","change","conf"].includes(x)) ? "move" : "open";
  let tailFixed = "";
  if(main==="過頭" && kind0==="move") tailFixed="衝勁是你的長處，只是這次要衝在對的地方。";
  if(main==="不足" && kind0==="keep") tailFixed="等待沒有錯，只是要知道你在等什麼。";
  const same = suitOf(c2) && suitOf(c2)===suitOf(c3) && RANK_ADV[rankOf(c3)] && !r3;
  if(same) tailFixed = RANK_ADV[rankOf(c3)].replace("{d}", domainOf(c2)) + "，這正好就是盲點的解法。";
  const imgKind = main==="過頭" && kind0!=="move" ? "keep" : main==="不足" && kind0!=="keep" ? "move" : kind0;
  // 牌的回答：依問題類型回答（2026-11-21 壓力測試後修正：原本只依建議牌挑五句之一，常常沒回答到問題）
  let qAns = "";
  if(q){
    const brake = r3 && (adv.tags.includes("act")||adv.tags.includes("worry"));
    const tone = cardTone(c1,r1) + cardTone(c2,r2) + cardTone(c3,r3) - 2*cards.filter(([c,r])=>!r && HEAVY.has(c)).length;
    const slow = brake || SLOWW.has(adv.tags[0]) || tone < -1;
    const advS = adv.advice.replace(/[。！]$/,"");
    const qKind = qTypeOf(q);
    if(qKind==="要不要") qAns = brake ? "要做，但不是現在這種衝法。" : POSW.has(adv.tags[0]) ? "可以，但要用對方法。" : adv.tags[0]==="steady" ? "可以，只是要穩穩來。"
      : SLOWW.has(adv.tags[0]) ? "先不急，時候還沒到。" : `先別急著決定，先${advS}。`;
    else if(qKind==="會不會") qAns = tone > 0 ? `有機會，但要照建議牌說的做：${advS}。` : pick([`必須誠實地說，機率可能不高。如果還想試，關鍵在：${advS}。`, `老實說，機率可能不高。要有機會，得先做到：${advS}。`]);
    else if(qKind==="對方怎麼想"){ const bS = blind.state.replace(/[。！]$/,"");
      qAns = pick([`會這樣問，通常是因為你心裡沒什麼把握。可能是對方沒有給出對等的回應，也可能是你感受不到對方的表示。牌看到的是：${bS}，你的不安，多半是從這裡來的。`,
                   `這個問題背後，是你心裡的不安。與其猜對方，先看看牌點出的這一點：${bS}。`,
                   `你會想知道對方怎麼想，是因為你還感受不到足夠的安全感。牌看到你們之間卡在：${bS}。`]); }
    else if(qKind==="怎麼做") qAns = `照建議牌來：${advS}。`;
    else if(qKind==="什麼時候") qAns = slow ? "還要一段時間，先把盲點說的那件事放下，事情才會動。" : "不會太久，等你先做到建議牌說的那件事。";
    else if(qKind==="是不是") qAns = now.pol < 0 ? `有一點。牌看到的是：${now.state.replace(/[。！]$/,"")}。` : `沒有你想的那麼嚴重。牌看到的是：${now.state.replace(/[。！]$/,"")}。`;
    else qAns = "答案不在別人身上，在你怎麼看這件事。";
  }
  // ---- 三張牌框架：問題→現況→盲點→建議 ----
  const R = composeReading({cards, state:S.state, topic:S.land.topic, area, landKey:S.land.key, q,
    clue: clueAns ? `記得你跟${queen}說的「${clueAns}」嗎？${CLUE_SAY[clue] ? CLUE_SAY[clue] + "，這也是盲點想提醒你的。" : "這也是盲點想提醒你的。"}` : "",
    ev, fits, main,
    f:{advS: adv.advice.replace(/[。！]$/,""), nowCtx:ctxNow,
       nowConnected: now.tags.some(t=>TOPIC_W[S.land.key][t]),
       blindPolNonNeg: blind.pol >= 0,
       advRvPos: r3 && MEANINGS[c3].rv.f.some(x=>facetPol(x)>0),
       advPos: r3 ? pickFacet(c3,true,mergeW(base,TEND_ADV[main]),3).advice : "",
       advOff: OFF[CASE_TOPIC[S.land.key]].test(adv.advice), nowName:now.name, nowTags:now.tags, blindTags:blind.tags, advTags:adv.tags,
       nowState:now.state, blindState:blind.state, blindDom, blindPos: blind.pol>0, advAdvice:adv.advice, advState:adv.state,
       advCtx:ctxAdv, tailFixed, img:IMG[S.land.key][imgKind], qAns}});
  const lines = R.lines;
  const dbg = `傾向：過頭 ${cnt["過頭"]}・不足 ${cnt["不足"]}・中道 ${cnt["中道"]}（主：${main}）　盲點線索：${clue||"無"}　問題字詞：${Object.keys(qw).join("、")||"無"}
前後文：現況 ${ctxNow.toFixed(1)}${r1?"・"+mode(r1,ctxNow):""}　建議 ${ctxAdv.toFixed(1)}${r3?"・"+mode(r3,ctxAdv):""}
現況挑「${now.name}」〔${now.tags.join("、")}〕　盲點挑「${blind.name}」〔${blind.tags.join("、")}〕　建議挑「${adv.name}」〔${adv.tags.join("、")}〕
框架來源：${R.src}`;
  return {lines, facets:[now,blind,adv], dbg};
}

function cardFace(card, rev){
  const id = MEANINGS[card].id, major = id[0]==="M";
  const c = el("div", "card face" + (rev ? " reversed" : "") + (major ? " major" : ""));
  c.innerHTML = `<div class="card-art"><img src="img/cards/${id}.jpg" alt="${esc(dn(card))}" draggable="false"></div>`;
  c.appendChild(el("div", "card-cap", `${esc(dn(card))}・<span class="o">${rev ? "逆位" : "正位"}</span>`));
  return c;
}
function showHut(cards){
  theme("cliff"); fillJump();
  $("#where").textContent = `懸崖上的小木屋・${S.land.topic}・${S.state}`;
  cards = cards || drawCards();
  const r = ayaRead(cards);
  const pair = S.state==="有伴侶" && S.land.key==="chenghu";
  const s = stage();
  s.appendChild(el("div", "chapter-kicker", "旅程的終點"));
  s.appendChild(el("div", "cover-hero", `<img src="img/v3/cover_cliff.jpg" alt="懸崖上的小木屋"><div class="cover-ov"><h1 class="cover-title">小木屋</h1><p class="cover-lead">懸崖上，燈還亮著</p></div>`));
  const scene = `${pair?"你們":"你"}照著${QUEEN[S.land.key]}說的，往那座山走。懸崖邊的木屋亮著燈，門沒關。一個女人坐在桌子後面，手邊放著一副牌。她抬頭看了${pair?"你們":"你"}一眼：「坐吧。我是綾。」${pair?"你的伴侶在你旁邊坐下。綾把牌推到你面前：「問題是你帶來的，牌你來抽。」你抽了三張。":"她洗了牌，攤開，讓你抽了三張。"}`;
  s.appendChild(el("p", "narr", esc(scene)));
  const hintEl = el("p", "hint center", "點牌背，一張一張翻開。"); s.appendChild(hintEl);
  const row = el("div", "card-row");
  const pos = ["現況","盲點","建議"];
  const reading = el("div", "reading");
  let flipped = 0;
  cards.forEach(([c,rv], i) => {
    const slot = el("div", "card-slot");
    slot.appendChild(el("div", "slot-cap", pos[i]));
    const back = el("div", "card back", `<div class="back-pattern"></div>`);
    back.onclick = () => {
      const f = cardFace(c, rv); f.classList.add("flip-in"); back.replaceWith(f);
      flipped++; if(flipped===3) showReading();
    };
    slot.appendChild(back); row.appendChild(slot);
  });
  s.appendChild(row);
  s.appendChild(reading);
  function showReading(){
    hintEl.remove();
    reading.innerHTML = `<div class="ending-box"><div class="say"><div class="av">綾</div><div><div class="who">綾</div>${r.lines.map(l=>`<p>${esc(l)}</p>`).join("")}</div></div><div class="dbg">${esc(r.dbg)}</div></div>`;
    S.trace.push("\n## 懸崖上的小木屋", scene);
    if(PROFILE.question) S.trace.push("帶來的問題："+PROFILE.question);
    S.trace.push("抽到："+cards.map(([c,rv],i)=>pos[i]+" "+dn(c)+(rv?"（逆）":"（正）")).join("／"));
    r.lines.forEach(l=>S.trace.push("綾："+l)); S.trace.push("〔"+r.dbg+"〕");
    const paid = el("div", "paid-row");
    // 付費解牌：開放後把 PAID_OPEN 改成 true
    if(PAID_OPEN){ const p = el("button", "btn ghost", "請綾細說（30 元）"); p.onclick = () => toast("付費解牌之後再開放"); paid.appendChild(p); }
    const redraw = el("button", "btn ghost testonly", "重新抽三張（測試）"); redraw.onclick = () => showHut();
    paid.appendChild(redraw);
    reading.appendChild(paid);
    // 測試：指定三張牌
    const pickBox = el("div", "testonly pick-box");
    const opt = DECK.map(c=>`<option value="${esc(c)}">${esc(dn(c))}</option>`).join("");
    pickBox.innerHTML = `<div class="step-label" style="margin:20px 0 8px">指定三張牌（測試）</div>` +
      pos.map((p,i)=>`<label>${p} <select data-i="${i}">${opt}</select> <input type="checkbox" data-r="${i}">逆位</label>`).join("") +
      `<button class="btn ghost small" id="pick-go">用這三張解</button>`;
    pickBox.querySelectorAll("select").forEach((sel,i)=>{ sel.value = cards[i][0]; });
    pickBox.querySelectorAll("input[data-r]").forEach((cb,i)=>{ cb.checked = !!cards[i][1]; });
    pickBox.querySelector("#pick-go").onclick = () => showHut([0,1,2].map(i=>[pickBox.querySelector(`select[data-i="${i}"]`).value, pickBox.querySelector(`input[data-r="${i}"]`).checked]));
    reading.appendChild(pickBox);
    // 這一路的選擇（測試時看）
    const log = el("div", "testonly");
    log.innerHTML = `<h3 class="step-label" style="margin-top:26px">這一路的選擇</h3>
      ${PROFILE.warm?`<p class="carry"><b>暖身題</b>${esc(PROFILE.warm)}</p>`:""}
      <p class="carry"><b>暱稱</b>${esc(PROFILE.nick||"旅人")}${S.land.key==="chenghu"&&(S.state==="單身"||S.state==="曖昧")?`　<b>心動的人</b>${esc(PROFILE.him)}（這次是${esc(LOVE.name)}）`:""}</p>
      <ol class="log">${S.log.map(l=>`<li><span class="et">${esc(l.ev)}</span>${esc(fill(l.text))}${tagsHTML(l.tags)}</li>`).join("")}</ol>`;
    reading.appendChild(log);
    const keep = el("div", "keep-holder");
    const end = el("div", "btn-row");
    const save = el("button", "btn primary", "存下這張牌");
    save.onclick = () => showKeepCard(cards, r, keep, save);
    const other = el("button", "btn ghost", "問別的事"); other.onclick = () => go("fortune");
    end.appendChild(save); end.appendChild(other);
    reading.appendChild(end);
    reading.appendChild(keep);
    const links = el("div", "text-links");
    const again = el("button", "link", "再走一次"); again.onclick = () => arrive(S.land.key, S.state);
    const home = el("button", "link", "回到共同主頁"); home.onclick = () => go("");
    links.appendChild(again); links.appendChild(home);
    reading.appendChild(links);
    reading.scrollIntoView({behavior:"smooth", block:"start"});
  }
}
// ================================================================
// 紀念卡（2026-11-23）：「綾為你抽的三張牌」，1080 × 1920
// 與《我來異世界可不想再成為塔羅師》的紀念卡用同一套外觀。卡上只印問題的主題與狀態，不印玩家打的問題內容。
// ================================================================
const KS = { bg: "#1c1410", ink: "#f4ead8", ink2: "#cdb99c", muted: "#9a8670", gold: "#e8c27a", ember: "#e0693a",
  paper: "#f4e9d6", paperInk: "#3a2618", line: "rgba(232,194,122,.38)" };
const KF = '"Iansui","Noto Serif TC","Songti TC",serif';
function loadImg(src){ return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; }); }
function rrect(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
// 中文斷行：先在「，；」斷，放不下才逐字斷；句讀不放行首
function wrapZh(g, text, maxW){
  const chunks = text.match(/[^，；。！？]+[，；。！？]?/g) || [text];
  const lines = []; let cur = "";
  const pushChars = (s) => { for(const ch of s){ if(cur && g.measureText(cur + ch).width > maxW){
      if("，。、！？」』：；）…".includes(ch) && cur.length > 1){ lines.push(cur.slice(0, -1)); cur = cur.slice(-1) + ch; } else { lines.push(cur); cur = ch; } } else cur += ch; } };
  chunks.forEach(c => { if(g.measureText(cur + c).width <= maxW) cur += c; else if(g.measureText(c).width <= maxW){ if(cur) lines.push(cur); cur = c; } else pushChars(c); });
  if(cur) lines.push(cur);
  return lines;
}
let _qr;
function qrLib(){
  if(!_qr) _qr = new Promise(res => {
    if(window.qrcode) return res(window.qrcode);
    const sc = document.createElement("script");
    sc.src = "lib/qrcode.min.js";
    sc.onload = () => res(window.qrcode || null); sc.onerror = () => res(null);
    document.head.appendChild(sc); setTimeout(() => res(window.qrcode || null), 4000);
  });
  return _qr;
}
function ksTarotCard(g, x, y, w, h, img, reversed){
  const m = Math.round(w * .045);
  g.save(); g.shadowColor = "rgba(0,0,0,.55)"; g.shadowBlur = 50; g.shadowOffsetY = 18;
  rrect(g, x, y, w, h, 18); g.fillStyle = KS.paper; g.fill(); g.restore();
  const ax = x + m, ay = y + m, aw = w - m * 2, ah = h - m * 2;
  if(img){
    g.save(); rrect(g, ax, ay, aw, ah, 6); g.clip();
    if(reversed){ g.translate(ax + aw / 2, ay + ah / 2); g.rotate(Math.PI); g.translate(-(ax + aw / 2), -(ay + ah / 2)); }
    const sc = Math.max(aw / img.width, ah / img.height), iw = img.width * sc, ih = img.height * sc;
    g.drawImage(img, ax + (aw - iw) / 2, ay + (ah - ih) / 2, iw, ih); g.restore();
  }
  g.strokeStyle = KS.paperInk; g.lineWidth = 2; rrect(g, ax, ay, aw, ah, 6); g.stroke();
}
async function drawReadingCard(d){
  const W = 1080, H = 1920, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  const txt = "來異世界找塔羅師懸崖上的小木屋你帶來的問題綾為抽三張牌正逆位說也帶個讓幫「」：・" + d.topic + d.state + d.date + d.say + d.cards.map(c => c.pos + c.name + c.word).join("") + FORTUNE_URL;
  try{ if(document.fonts){ await document.fonts.load(`40px "Iansui"`, txt); await document.fonts.load(`bold 40px "Noto Serif TC"`, txt); await document.fonts.ready; } }catch(e){}
  const [cover, lib, ...imgs] = await Promise.all([loadImg("img/v3/cover_cliff.jpg"), qrLib(), ...d.cards.map(c => loadImg(c.img))]);
  // 底色＋紙紋
  g.fillStyle = KS.bg; g.fillRect(0, 0, W, H);
  const rg = g.createRadialGradient(W / 2, 640, 60, W / 2, 640, 900); rg.addColorStop(0, "#9b86c940"); rg.addColorStop(1, "#9b86c900");
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  let sd = 11; const rnd = () => (sd = (sd * 9301 + 49297) % 233280) / 233280;
  for(let i = 0; i < 2600; i++){ g.fillStyle = rnd() < .5 ? "rgba(255,235,200,.035)" : "rgba(0,0,0,.08)"; g.fillRect(rnd() * W, rnd() * H, 2, 2); }
  // 上方：懸崖小木屋，淡進底色
  if(cover){
    const h = 560;
    g.save(); g.globalAlpha = .55; g.drawImage(cover, 0, 120, W, cover.height * W / cover.width); g.restore();
    const fade = g.createLinearGradient(0, 120, 0, 120 + h);
    fade.addColorStop(0, "rgba(28,20,16,.15)"); fade.addColorStop(.7, "rgba(28,20,16,.85)"); fade.addColorStop(1, KS.bg);
    g.fillStyle = fade; g.fillRect(0, 120, W, h + 2);
    const top = g.createLinearGradient(0, 0, 0, 260); top.addColorStop(0, KS.bg); top.addColorStop(.45, KS.bg); top.addColorStop(1, "rgba(28,20,16,0)");
    g.fillStyle = top; g.fillRect(0, 0, W, 260);
    g.fillStyle = KS.bg; g.fillRect(0, 120 + h, W, H);
  }
  g.textAlign = "center";
  g.fillStyle = KS.gold; g.font = `34px ${KF}`; g.fillText("來異世界找塔羅師", W / 2, 112);
  g.fillStyle = KS.muted; g.font = `28px ${KF}`; g.fillText(`懸崖上的小木屋・${d.date}`, W / 2, 160);
  g.fillStyle = KS.gold; g.font = `34px ${KF}`; g.fillText(`你帶來的問題：${d.topic}・${d.state}`, W / 2, 420);
  g.fillStyle = KS.ink; g.font = `bold 64px ${KF}`; g.fillText("綾為你抽的三張牌", W / 2, 510);
  const cw = 280, ch = 470, gap = 40, x0 = (W - (cw * 3 + gap * 2)) / 2, cy = 620;
  d.cards.forEach((c, i) => {
    const x = x0 + i * (cw + gap);
    g.textAlign = "center"; g.fillStyle = KS.gold; g.font = `34px ${KF}`; g.fillText(c.pos, x + cw / 2, cy - 26);
    ksTarotCard(g, x, cy, cw, ch, imgs[i], c.rev);
    g.fillStyle = KS.ink; g.font = `34px ${KF}`; g.fillText(c.name, x + cw / 2, cy + ch + 58);
    g.fillStyle = c.rev ? KS.ember : KS.muted; g.font = `28px ${KF}`; g.fillText(c.rev ? "逆位" : "正位", x + cw / 2, cy + ch + 100);
    g.fillStyle = KS.ink2; g.font = `30px ${KF}`;
    wrapZh(g, c.word, cw).slice(0, 2).forEach((l, k) => g.fillText(l, x + cw / 2, cy + ch + 152 + k * 42));
  });
  let y = 1440;
  g.strokeStyle = KS.line; g.lineWidth = 1.5; g.beginPath(); g.moveTo(90, y - 60); g.lineTo(W - 90, y - 60); g.stroke();
  g.fillStyle = KS.muted; g.font = `30px ${KF}`; g.textAlign = "center"; g.fillText("綾說", W / 2, y);
  y += 70; g.fillStyle = KS.ink; g.font = `44px ${KF}`;
  const say = wrapZh(g, d.say, W - 220).slice(0, 3);
  say.forEach((l, i) => { g.fillText((i === 0 ? "「" : "") + l + (i === say.length - 1 ? "」" : ""), W / 2, y); y += 62; });
  // 頁尾
  const fy = H - 210;
  g.strokeStyle = KS.line; g.beginPath(); g.moveTo(90, fy); g.lineTo(W - 90, fy); g.stroke();
  g.textAlign = "left"; g.fillStyle = KS.ink; g.font = `40px ${KF}`; g.fillText("你也帶一個問題來，讓綾幫你抽", 90, fy + 92);
  g.fillStyle = KS.muted; g.font = `26px ${KF}`; g.fillText(FORTUNE_URL.replace(/^https?:\/\//, ""), 90, fy + 140);
  if(lib){ try{
    const q = lib(0, "M"); q.addData(FORTUNE_URL); q.make();
    const n = q.getModuleCount(), size = 140, x = W - 90 - size, qy = fy + 32, cell = size / (n + 4);
    g.fillStyle = KS.paper; rrect(g, x, qy, size, size, 12); g.fill(); g.fillStyle = KS.paperInk;
    for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(q.isDark(r, c)) g.fillRect(x + (c + 2) * cell, qy + (r + 2) * cell, Math.ceil(cell), Math.ceil(cell));
  }catch(e){} }
  return cv;
}
let _dl;
function downloadsCap(){
  if(_dl === undefined) _dl = (window.claude && typeof window.claude.use === "function") ? Promise.resolve(window.claude.use("downloads")).catch(() => null) : Promise.resolve(null);
  return _dl;
}
async function saveCard(cv, filename){
  const blob = await new Promise(r => cv.toBlob(r, "image/png"));
  const dl = await downloadsCap();
  if(dl){ try{ await dl.save({ filename, data: blob }); toast("圖片已存好"); }catch(e){ if(!e || e.code !== "declined") toast("這裡沒辦法直接下載，請長按圖片另存"); } return; }
  try{ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); toast("如果沒有開始下載，請長按圖片另存"); }
  catch(e){ toast("請長按圖片另存"); }
}
async function showKeepCard(cards, r, box, btn){
  if(box.dataset.done){ box.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  btn.disabled = true; box.innerHTML = "<p class='hint'>卡片繪製中……</p>";
  const now = new Date(), date = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, "0")}.${String(now.getDate()).padStart(2, "0")}`;
  const pos = ["現況", "盲點", "建議"];
  const lines = r.lines.filter(l => l && l.length < 80);
  const d = { date, topic: S.land.topic, state: S.state,
    say: (lines[lines.length - 1] || r.lines[r.lines.length - 1] || "").replace(/^「|」$/g, ""),
    cards: cards.map(([c, rv], i) => ({ pos: pos[i], name: dn(c), rev: !!rv, img: `img/cards/${MEANINGS[c].id}.jpg`, word: r.facets[i].name })) };
  try{
    const cv = await drawReadingCard(d);
    const img = el("img", "keep-img"); img.src = cv.toDataURL("image/png"); img.alt = "綾為你抽的三張牌";
    box.innerHTML = ""; box.appendChild(img);
    const dlb = el("button", "btn ghost", "下載圖片");
    dlb.onclick = () => saveCard(cv, `來異世界找塔羅師-${d.topic}-${date}.png`);
    box.appendChild(dlb);
    box.appendChild(el("p", "hint center", "手機上也可以長按圖片另存。卡上不會出現你打的問題。"));
    box.dataset.done = "1";
    btn.textContent = "看我的牌卡"; btn.disabled = false;
    box.scrollIntoView({ behavior: "smooth", block: "start" });
  }catch(e){
    box.innerHTML = "<p class='hint'>卡片畫不出來，請換個瀏覽器試試。</p>"; btn.disabled = false;
  }
}
$("#copy").onclick = async () => {
  if(!S){ $("#copied").textContent = "還沒開始旅程"; return; }
  try{ await navigator.clipboard.writeText(S.trace.join("\n")); $("#copied").textContent = "已複製"; }
  catch(e){ $("#copied").textContent = "無法自動複製"; }
};
